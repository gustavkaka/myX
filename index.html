<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My X</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000; color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; justify-content: center; min-height: 100vh;
    }
    .container {
      width: 100%; max-width: 600px;
      border-left: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1);
      min-height: 100vh; display: flex; flex-direction: column;
      padding-bottom: 60px; position: relative;
    }
    header {
      position: sticky; top: 0; background-color: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10;
    }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; cursor: pointer; }
    .view { display: none; flex: 1; flex-direction: column; }
    .view.active { display: flex; }

    /* 投稿欄 */
    .post-box {
      padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex; gap: 12px; position: sticky; top: 45px;
      background-color: #000000; z-index: 9;
    }
    .post-box.static { position: static; border-bottom: none; padding: 8px 0 0 0; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; background-color: #202327;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);
    }
    .avatar svg { width: 22px; height: 22px; fill: #71767b; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .post-input-area { flex: 1; min-width: 0; }
    textarea {
      width: 100%; background: transparent; border: none; color: #e7e9ea;
      font-size: 16px; resize: none; outline: none; min-height: 70px; font-family: inherit;
    }
    textarea::placeholder { color: #71767b; }
    .post-actions {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;
    }
    .btn-media-attach {
      background: none; border: none; color: #1d9bf0; cursor: pointer; padding: 6px;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      transition: background-color 0.2s;
    }
    .btn-media-attach:hover { background-color: rgba(29,155,240,0.1); }
    .btn-media-attach svg { width: 20px; height: 20px; fill: currentColor; }
    .btn-submit {
      background-color: #1d9bf0; color: white; border: none; padding: 8px 18px;
      border-radius: 20px; font-weight: 700; font-size: 14px; cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s;
    }
    .btn-submit:active { transform: scale(0.95); background-color: #1a8cd8; }
    .btn-cancel {
      background: none; border: 1px solid rgba(255,255,255,0.25); color: #e7e9ea;
      padding: 6px 16px; border-radius: 16px; font-size: 13px; cursor: pointer;
    }

    /* 画像プレビュー */
    .preview-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .image-preview-container {
      position: relative; border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .image-preview-container img { max-height: 100px; width: auto; max-width: 100%; display: block; object-fit: cover; }
    .btn-remove-preview {
      position: absolute; top: 6px; right: 6px; background-color: rgba(15,20,25,0.75);
      color: #fff; border: none; border-radius: 50%; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
      backdrop-filter: blur(4px); font-size: 14px; line-height: 1;
    }

    /* ツイートカード */
    .timeline { flex: 1; }
    .tweet-card-wrapper { border-bottom: 1px solid rgba(255,255,255,0.1); position: relative; }
    .retweet-header-label {
      padding: 8px 16px 0 48px; font-size: 13px; font-weight: 700; color: #71767b;
      display: flex; align-items: center; gap: 6px;
    }
    .retweet-header-label svg { width: 14px; height: 14px; fill: currentColor; }
    .tweet-card {
      padding: 12px 16px; display: flex; gap: 12px; position: relative;
      transition: background-color 0.2s; cursor: pointer;
    }
    .tweet-card:hover { background-color: rgba(255,255,255,0.03); }
    .tweet-card.main-target-tweet {
      background-color: rgba(29,155,240,0.05); border-left: 3px solid #1d9bf0;
      padding-top: 16px; padding-bottom: 16px;
    }
    .tweet-card.main-target-tweet .tweet-text { font-size: 17px; line-height: 1.6; }
    .avatar-column { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
    .thread-line { width: 2px; background-color: #333639; flex: 1; min-height: 12px; margin-top: 4px; }
    .tweet-body { flex: 1; min-width: 0; }
    .tweet-header { display: flex; align-items: center; gap: 6px; }
    .user-name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-handle, .tweet-date { color: #71767b; font-size: 14px; white-space: nowrap; }
    .tweet-date { margin-left: auto; font-size: 12px; }
    .tweet-text { font-size: 15px; line-height: 1.5; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
    .hashtag { color: #1d9bf0; cursor: pointer; }
    .hashtag:hover { text-decoration: underline; }
    .tweet-images { display: grid; gap: 4px; margin-top: 10px; border-radius: 16px; overflow: hidden; }
    .tweet-images.count-1 { grid-template-columns: 1fr; }
    .tweet-images.count-2, .tweet-images.count-3, .tweet-images.count-4 { grid-template-columns: 1fr 1fr; }
    .tweet-images img { width: 100%; height: 180px; object-fit: cover; display: block; cursor: pointer; }
    .tweet-images.count-1 img { height: auto; max-height: 320px; }
    .tweet-actions-row {
      display: flex; justify-content: space-between; max-width: 340px; margin-top: 10px;
    }
    .action-btn {
      background: none; border: none; color: #71767b; cursor: pointer;
      display: flex; align-items: center; gap: 4px; font-size: 13px; padding: 4px;
      border-radius: 9999px; transition: color 0.2s, background-color 0.2s;
    }
    .action-btn svg { width: 18px; height: 18px; fill: currentColor; }
    .action-btn:hover { color: #1d9bf0; background-color: rgba(29,155,240,0.1); }
    .action-btn.liked { color: #f91880; }
    .action-btn.liked:hover { background-color: rgba(249,24,128,0.1); }
    .action-btn.retweeted { color: #00ba7c; }
    .action-btn.retweeted:hover { background-color: rgba(0,186,124,0.1); }
    .action-btn.bookmarked { color: #1d9bf0; }
    .menu-wrap { position: relative; flex-shrink: 0; }
    .btn-menu {
      background: none; border: none; color: #71767b; cursor: pointer; padding: 4px 8px;
      border-radius: 9999px; font-size: 16px; line-height: 1;
    }
    .btn-menu:hover { color: #1d9bf0; background-color: rgba(29,155,240,0.1); }
    .dropdown-menu {
      display: none; position: absolute; right: 0; top: 28px; z-index: 30;
      background-color: #000; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
      box-shadow: 0 0 15px rgba(255,255,255,0.15); min-width: 150px; overflow: hidden;
    }
    .dropdown-menu.show { display: block; }
    .dropdown-item { padding: 12px 16px; font-size: 14px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
    .dropdown-item:hover { background-color: rgba(255,255,255,0.05); }
    .dropdown-item.danger { color: #f4212e; }
    .nested-reply-wrapper { border-left: 2px solid rgba(255,255,255,0.08); }
    .empty-state { padding: 48px 24px; text-align: center; color: #71767b; font-size: 14px; line-height: 1.7; }

    /* 検索 */
    .search-box-area { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .search-input-container { position: relative; }
    .search-icon-inside {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; fill: #71767b; pointer-events: none;
    }
    .search-input {
      width: 100%; background-color: #202327; border: 1px solid transparent; border-radius: 9999px;
      padding: 12px 16px 12px 44px; color: #e7e9ea; font-size: 15px; outline: none;
    }
    .search-input:focus { background-color: #000; border-color: #1d9bf0; }

    /* タグ */
    .tag-header-area {
      display: flex; align-items: flex-start; gap: 8px; padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .tag-list-bar { display: flex; flex-wrap: wrap; gap: 8px; flex: 1; }
    .tag-pill {
      background-color: #202327; border: 1px solid rgba(255,255,255,0.08); color: #e7e9ea;
      border-radius: 9999px; padding: 7px 14px; font-size: 14px; cursor: pointer;
      display: inline-flex; gap: 6px; align-items: baseline;
    }
    .tag-pill .tag-count { color: #71767b; font-size: 12px; }
    .tag-pill.active { background-color: #1d9bf0; border-color: #1d9bf0; color: #fff; }
    .tag-pill.active .tag-count { color: rgba(255,255,255,0.8); }

    /* メディア */
    .media-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
    .media-item { aspect-ratio: 1; overflow: hidden; cursor: pointer; background-color: #202327; }
    .media-item img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* 設定 */
    .page-content { padding: 16px; }
    .profile-card { display: flex; align-items: center; gap: 16px; padding: 8px 0 20px; }
    .profile-avatar-large {
      width: 72px; height: 72px; border-radius: 50%; overflow: hidden; position: relative;
      background-color: #202327; cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .profile-avatar-large img { width: 100%; height: 100%; object-fit: cover; }
    .profile-avatar-large svg { width: 38px; height: 38px; fill: #71767b; }
    .avatar-edit-badge {
      position: absolute; right: 0; bottom: 0; background-color: #1d9bf0; border-radius: 50%;
      width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    }
    .avatar-edit-badge svg { width: 13px; height: 13px; fill: #fff; }
    .profile-info-name { font-size: 19px; font-weight: 800; }
    .profile-info-handle { color: #71767b; font-size: 14px; }
    .settings-section-title { font-size: 15px; font-weight: 700; margin: 18px 0 8px; }
    .settings-list { border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; overflow: hidden; }
    .settings-item { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .settings-item:last-child { border-bottom: none; }
    .settings-item-label { display: block; font-size: 12px; color: #71767b; margin-bottom: 4px; }
    .settings-item-input { width: 100%; background: none; border: none; color: #e7e9ea; font-size: 16px; outline: none; }
    .settings-item-btn {
      padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .settings-item-btn:last-child { border-bottom: none; }
    .settings-item-btn:hover { background-color: rgba(255,255,255,0.03); }
    .settings-item-btn svg { width: 20px; height: 20px; fill: #71767b; flex-shrink: 0; }
    .settings-item-title { display: block; font-size: 15px; }
    .settings-item-sub { display: block; font-size: 12px; color: #71767b; margin-top: 2px; }
    .settings-note { font-size: 12px; color: #71767b; line-height: 1.7; margin-top: 14px; }

    /* モーダル共通 */
    .modal {
      display: none; position: fixed; inset: 0; z-index: 100;
      background-color: rgba(91,112,131,0.4); align-items: flex-start; justify-content: center;
      overflow-y: auto; padding: 24px 12px;
    }
    .modal.show { display: flex; }
    .modal-container {
      background-color: #000; border-radius: 16px; width: 100%; max-width: 560px;
      padding: 16px; border: 1px solid rgba(255,255,255,0.1);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-bottom: 8px;
    }
    .modal-title { font-weight: 700; font-size: 16px; }
    .reply-target-preview { display: flex; gap: 12px; margin-bottom: 4px; }
    .reply-target-line { width: 2px; background-color: #333639; flex: 1; min-height: 10px; margin-top: 4px; }
    .reply-target-text { font-size: 14px; color: #cfd3d6; margin-top: 2px; white-space: pre-wrap; word-break: break-word; }
    .image-modal { align-items: center; background-color: rgba(0,0,0,0.92); }
    .image-modal img { max-width: 96vw; max-height: 92vh; border-radius: 8px; }

    /* 確認シート＆トースト */
    .confirm-sheet {
      display: none; position: fixed; inset: 0; z-index: 200;
      background-color: rgba(91,112,131,0.4); align-items: flex-end; justify-content: center;
    }
    .confirm-sheet.show { display: flex; }
    .confirm-box {
      background-color: #000; border: 1px solid rgba(255,255,255,0.15); border-radius: 18px 18px 0 0;
      width: 100%; max-width: 600px; padding: 22px 18px 30px; text-align: center;
    }
    .confirm-message { font-size: 15px; line-height: 1.6; margin-bottom: 18px; white-space: pre-wrap; }
    .confirm-buttons { display: flex; gap: 10px; }
    .confirm-buttons button { flex: 1; padding: 12px; border-radius: 9999px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-confirm-yes { background-color: #f4212e; color: #fff; border: none; }
    .btn-confirm-yes.normal { background-color: #1d9bf0; }
    .btn-confirm-no { background: none; color: #e7e9ea; border: 1px solid rgba(255,255,255,0.3); }
    .toast {
      position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px);
      background-color: #1d9bf0; color: #fff; font-size: 14px; padding: 11px 18px; border-radius: 10px;
      opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 300;
      max-width: 88vw; text-align: center; box-shadow: 0 4px 18px rgba(0,0,0,0.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 下部ナビ */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 600px; height: 56px;
      background-color: rgba(0,0,0,0.9); backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255,255,255,0.1);
      display: flex; justify-content: space-around; align-items: center; z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item { background: none; border: none; cursor: pointer; padding: 10px; border-radius: 9999px; }
    .nav-item svg { width: 24px; height: 24px; fill: #71767b; display: block; }
    .nav-item.active svg { fill: #f7f9f9; }
  </style>
</head>
<body>
  <div class="container">
    <header><h1 id="headerTitle" data-action="go-home">ホーム</h1></header>

    <!-- 1. タイムライン -->
    <div id="view-home" class="view active">
      <div class="post-box">
        <div class="avatar my-avatar-container"></div>
        <div class="post-input-area">
          <textarea id="tweetInput" placeholder="今なにしてる？"></textarea>
          <div id="tweetImagePreviewArea" style="display:none;"></div>
          <div class="post-actions">
            <button class="btn-media-attach" data-action="pick-images" data-kind="tweet" title="画像を追加">
              <svg viewBox="0 0 24 24"><path d="M19.75 2H4.25C3.01 2 2 3.01 2 4.25v15.5C2 20.99 3.01 22 4.25 22h15.5c1.24 0 2.25-1.01 2.25-2.25V4.25C22 3.01 20.99 2 19.75 2zM4.25 3.5h15.5c.41 0 .75.34.75.75v12.56l-3.52-3.52c-.73-.73-1.91-.73-2.65 0L10.5 17.17l-2.09-2.09c-.73-.73-1.91-.73-2.65 0L3.5 17.34V4.25c0-.41.34-.75.75-.75zm0 17c-.19 0-.36-.07-.49-.2l3.41-3.41c.15-.15.39-.15.53 0l2.09 2.09c.39.39 1.02.39 1.41 0l4.38-4.38c.15-.15.39-.15.53 0l3.92 3.92H4.25zM15.5 10c1.38 0 2.5-1.12 2.5-2.5S16.88 5 15.5 5 13 6.12 13 7.5s1.12 2.5 2.5 2.5zm0-3.5c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1z"/></svg>
            </button>
            <button class="btn-submit" data-action="submit-tweet">つぶやく</button>
          </div>
        </div>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>

    <!-- 2. 検索 -->
    <div id="view-search" class="view">
      <div class="search-box-area">
        <div class="search-input-container">
          <svg class="search-icon-inside" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="キーワードや #タグ で検索">
        </div>
      </div>
      <div class="timeline" id="searchResults"></div>
    </div>

    <!-- 3. ブックマーク -->
    <div id="view-bookmarks" class="view">
      <div class="timeline" id="bookmarkTimeline"></div>
    </div>

    <!-- 4. タグ一覧 -->
    <div id="view-tags" class="view">
      <div class="tag-header-area"><div class="tag-list-bar" id="tagListBar"></div></div>
      <div class="timeline" id="tagTimeline"></div>
    </div>

    <!-- 5. メディア一覧 -->
    <div id="view-media" class="view">
      <div class="media-grid" id="mediaGrid"></div>
    </div>

    <!-- 6. アカウント設定 -->
    <div id="view-settings" class="view">
      <div class="page-content">
        <div class="profile-card">
          <div class="profile-avatar-large" data-action="pick-avatar">
            <div id="settingAvatarContainer" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;"></div>
            <div class="avatar-edit-badge"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></div>
          </div>
          <div class="profile-info">
            <div class="profile-info-name" id="displayProfileName">自分</div>
            <div class="profile-info-handle" id="displayProfileHandle">@you</div>
          </div>
        </div>

        <div class="settings-section-title">アカウント情報</div>
        <div class="settings-list">
          <div class="settings-item">
            <label class="settings-item-label">表示名</label>
            <input type="text" id="settingName" class="settings-item-input" value="自分">
          </div>
          <div class="settings-item">
            <label class="settings-item-label">ユーザー名</label>
            <input type="text" id="settingHandle" class="settings-item-input" value="@you">
          </div>
        </div>

        <div class="settings-section-title">データ管理</div>
        <div class="settings-list">
          <div class="settings-item-btn" data-action="export">
            <div><span class="settings-item-title">データをバックアップ (JSON保存)</span><span class="settings-item-sub">つぶやきや設定をファイルに書き出します</span></div>
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          </div>
          <div class="settings-item-btn" data-action="import">
            <div><span class="settings-item-title">データを復元 (JSON読み込み)</span><span class="settings-item-sub">保存したファイルからデータを読み込みます（重複は自動でスキップ）</span></div>
            <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
          </div>
        </div>
        <p class="settings-note">データはこの端末の中（IndexedDB）にだけ保存されます。どこにも送信されません。</p>
        <input type="file" id="importFileInput" accept=".json" style="display:none;">
      </div>
    </div>

    <input type="file" id="tweetFileInput" accept="image/*" multiple style="display:none;">
    <input type="file" id="replyFileInput" accept="image/*" multiple style="display:none;">
    <input type="file" id="editFileInput" accept="image/*" multiple style="display:none;">
    <input type="file" id="avatarFileInput" accept="image/*" style="display:none;">

    <!-- 返信モーダル -->
    <div class="modal" id="replyModal">
      <div class="modal-container">
        <div class="reply-target-preview">
          <div class="avatar-column">
            <div class="avatar" id="replyTargetAvatar"></div>
            <div class="reply-target-line"></div>
          </div>
          <div style="flex:1; min-width:0;">
            <div style="display:flex; gap:6px; align-items:center;">
              <span class="user-name" id="replyTargetName">自分</span>
              <span class="user-handle" id="replyTargetHandle">@you</span>
            </div>
            <div class="reply-target-text" id="replyTargetText"></div>
          </div>
        </div>
        <div class="post-box static">
          <div class="avatar my-avatar-container"></div>
          <div class="post-input-area">

  <script>
    'use strict';
    /* ============================================================
       My X rebuild v1 (2026-11-19)
       - データ互換: DB名 MyXDB v2 / stores tweets,settings / backup v1.0
       - データは起動時にメモリへ1回だけ読み、全画面はメモリから描画
       - ユーザー文字列は textContent / DOM構築でのみ入れ、直入れしない
       ============================================================ */
    let db = null;
    let allTweets = [];
    let currentUser = {
      name: localStorage.getItem('myX_name') || '自分',
      handle: localStorage.getItem('myX_handle') || '@you',
      avatar: ''
    };
    let currentView = 'home';
    let activeTag = '';
    let activeReplyTargetId = null;
    let activeEditId = null;
    let activeDetailId = null;
    const pendingImages = { tweet: [], reply: [], edit: [] };

    const ICONS = {
      reply: '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>',
      retweet: '<svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.42 4.42-1.41 1.41L5.5 7.71V15c0 1.66 1.34 3 3 3h7v2h-7c-2.76 0-5-2.24-5-5V7.71L1.49 9.71.08 8.3 4.5 3.88zM19.5 20.12l-4.42-4.42 1.41-1.41 2.01 2.01V9c0-1.66-1.34-3-3-3h-7V4h7c2.76 0 5 2.24 5 5v7.3l2.01-2.01 1.41 1.41-4.42 4.42z"/></svg>',
      like: '<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>',
      bookmark: '<svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>',
      share: '<svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>'
    };
    const DEFAULT_AVATAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';

    /* ---------- IndexedDB（Promise化） ---------- */
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('MyXDB', 2);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('tweets')) d.createObjectStore('tweets', { keyPath: 'id', autoIncrement: true });
          if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'key' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    function idbReq(storeName, mode, fn) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([storeName], mode);
        const store = tx.objectStore(storeName);
        const req = fn(store);
        if (req) {
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        } else {
          tx.oncomplete = () => resolve(undefined);
          tx.onerror = () => reject(tx.error);
        }
      });
    }
    const idbGetAllTweets = () => idbReq('tweets', 'readonly', s => s.getAll());
    const idbGetAllSettings = () => idbReq('settings', 'readonly', s => s.getAll());
    const idbAddTweet = (t) => idbReq('tweets', 'readwrite', s => s.add(t));
    const idbPutTweet = (t) => idbReq('tweets', 'readwrite', s => s.put(t));
    const idbDeleteTweet = (id) => idbReq('tweets', 'readwrite', s => s.delete(id));
    const idbGetSetting = (key) => idbReq('settings', 'readonly', s => s.get(key));
    const idbPutSetting = (key, value) => idbReq('settings', 'readwrite', s => s.put({ key, value }));

    /* ---------- 小物 ---------- */
    function formatTweetDate(timestamp, timeFallback) {
      if (!timestamp) return timeFallback || '';
      const d = new Date(timestamp);
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    function getTweet(id) { return allTweets.find(t => t.id === id) || null; }
    function childrenOf(id) { return allTweets.filter(t => t.parentId === id).sort((a, b) => a.createdAt - b.createdAt); }
    function replyCountOf(id) { return allTweets.reduce((n, t) => n + (t.parentId === id ? 1 : 0), 0); }
    function extractTags(text) {
      const tags = [];
      const re = /#([^\s#\u3000]+)/g;
      let m;
      while ((m = re.exec(text || '')) !== null) tags.push(m[1]);
      return tags;
    }
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }
    let confirmResolve = null;
    function showConfirm(message, yesLabel, danger) {
      return new Promise((resolve) => {
        confirmResolve = resolve;
        document.getElementById('confirmMessage').textContent = message;
        const yes = document.getElementById('confirmYes');
        yes.textContent = yesLabel || 'OK';
        yes.classList.toggle('normal', !danger);
        document.getElementById('confirmSheet').classList.add('show');
      });
    }
    function settleConfirm(v) {
      document.getElementById('confirmSheet').classList.remove('show');
      if (confirmResolve) { confirmResolve(v); confirmResolve = null; }
    }
    document.getElementById('confirmYes').addEventListener('click', () => settleConfirm(true));
    document.getElementById('confirmNo').addEventListener('click', () => settleConfirm(false));

    /* ---------- アバター ---------- */
    function setAvatarInto(el, avatarData) {
      el.textContent = '';
      const src = avatarData !== undefined ? avatarData : currentUser.avatar;
      if (src) {
        const img = document.createElement('img');
        img.src = src; img.alt = 'avatar';
        el.appendChild(img);
      } else {
        el.innerHTML = DEFAULT_AVATAR_SVG;
      }
    }
    function renderAllAvatars() {
      document.querySelectorAll('.my-avatar-container').forEach(el => setAvatarInto(el));
      setAvatarInto(document.getElementById('settingAvatarContainer'));
    }
    function initProfileUI() {
      document.getElementById('settingName').value = currentUser.name;
      document.getElementById('settingHandle').value = currentUser.handle;
      document.getElementById('displayProfileName').textContent = currentUser.name;
      document.getElementById('displayProfileHandle').textContent = currentUser.handle;
    }

    /* ---------- 本文（タグを安全にリンク化） ---------- */
    function buildTweetText(text) {
      const frag = document.createDocumentFragment();
      const lines = String(text || '').split('\n');
      lines.forEach((line, li) => {
        if (li > 0) frag.appendChild(document.createElement('br'));
        const re = /#([^\s#\u3000]+)/g;
        let last = 0, m;
        while ((m = re.exec(line)) !== null) {
          if (m.index > last) frag.appendChild(document.createTextNode(line.slice(last, m.index)));
          const span = document.createElement('span');
          span.className = 'hashtag';
          span.dataset.action = 'hashtag';
          span.dataset.tag = m[1];
          span.textContent = '#' + m[1];
          frag.appendChild(span);
          last = m.index + m[0].length;
        }
        if (last < line.length) frag.appendChild(document.createTextNode(line.slice(last)));
      });
      return frag;
    }

    /* ---------- ツイートカード（全画面共通の1本） ---------- */
    function makeActionBtn(action, id, icon, count, activeClass) {
      const btn = document.createElement('button');
      btn.className = 'action-btn' + (activeClass ? ' ' + activeClass : '');
      btn.dataset.action = action;
      btn.dataset.id = id;
      btn.innerHTML = icon;
      if (count) {
        const s = document.createElement('span');
        s.textContent = count;
        btn.appendChild(s);
      }
      return btn;
    }
    function createTweetCard(tweet, opts) {
      opts = opts || {};
      const card = document.createElement('div');
      card.className = 'tweet-card' + (opts.main ? ' main-target-tweet' : '');
      card.dataset.cardId = tweet.id;

      const col = document.createElement('div');
      col.className = 'avatar-column';
      const av = document.createElement('div');
      av.className = 'avatar';
      setAvatarInto(av, tweet.userAvatar || '');
      col.appendChild(av);
      if (opts.threadLine) {
        const line = document.createElement('div');
        line.className = 'thread-line';
        col.appendChild(line);
      }
      card.appendChild(col);

      const body = document.createElement('div');
      body.className = 'tweet-body';

      const header = document.createElement('div');
      header.className = 'tweet-header';
      const nameEl = document.createElement('span');
      nameEl.className = 'user-name';
      nameEl.textContent = tweet.userName || currentUser.name;
      const handleEl = document.createElement('span');
      handleEl.className = 'user-handle';
      handleEl.textContent = tweet.userHandle || currentUser.handle;
      const dateEl = document.createElement('span');
      dateEl.className = 'tweet-date';
      dateEl.textContent = formatTweetDate(tweet.createdAt, tweet.time);
      const menuWrap = document.createElement('div');
      menuWrap.className = 'menu-wrap';
      const menuBtn = document.createElement('button');
      menuBtn.className = 'btn-menu';
      menuBtn.dataset.action = 'menu';
      menuBtn.dataset.id = tweet.id;
      menuBtn.textContent = '•••';
      const menu = document.createElement('div');
      menu.className = 'dropdown-menu';
      menu.id = 'menu-' + tweet.id;
      const editItem = document.createElement('div');
      editItem.className = 'dropdown-item';
      editItem.dataset.action = 'edit';
      editItem.dataset.id = tweet.id;
      editItem.textContent = '編集する';
      const delItem = document.createElement('div');
      delItem.className = 'dropdown-item danger';
      delItem.dataset.action = 'delete';
      delItem.dataset.id = tweet.id;
      delItem.textContent = '削除する';
      menu.appendChild(editItem);
      menu.appendChild(delItem);
      menuWrap.appendChild(menuBtn);
      menuWrap.appendChild(menu);
      header.appendChild(nameEl);
      header.appendChild(handleEl);
      header.appendChild(dateEl);
      header.appendChild(menuWrap);
      body.appendChild(header);

      const textEl = document.createElement('div');
      textEl.className = 'tweet-text';
      textEl.appendChild(buildTweetText(tweet.text));
      body.appendChild(textEl);

      if (Array.isArray(tweet.images) && tweet.images.length) {
        const grid = document.createElement('div');
        grid.className = 'tweet-images count-' + Math.min(tweet.images.length, 4);
        tweet.images.slice(0, 4).forEach(src => {
          const img = document.createElement('img');
          img.src = src;
          img.alt = 'image';
          img.dataset.action = 'image';
          grid.appendChild(img);
        });
        body.appendChild(grid);
      }

      const row = document.createElement('div');
      row.className = 'tweet-actions-row';
      row.appendChild(makeActionBtn('reply', tweet.id, ICONS.reply, replyCountOf(tweet.id) || '', ''));
      row.appendChild(makeActionBtn('retweet', tweet.id, ICONS.retweet, tweet.retweetCount || '', tweet.isRetweeted ? 'retweeted' : ''));
      row.appendChild(makeActionBtn('like', tweet.id, ICONS.like, tweet.likeCount || '', tweet.isLiked ? 'liked' : ''));
      row.appendChild(makeActionBtn('bookmark', tweet.id, ICONS.bookmark, '', tweet.isBookmarked ? 'bookmarked' : ''));
      row.appendChild(makeActionBtn('share', tweet.id, ICONS.share, '', ''));
      body.appendChild(row);

      card.appendChild(body);
      return card;
    }
    function emptyState(text) {
      const d = document.createElement('div');
      d.className = 'empty-state';
      d.textContent = text;
      return d;
    }

    /* ---------- 描画 ---------- */
    function renderHome() {
      const tl = document.getElementById('timeline');
      tl.textContent = '';
      const parents = allTweets.filter(t => !t.parentId);
      parents.sort((a, b) => {
        const ta = a.isRetweeted && a.retweetedAt ? a.retweetedAt : a.createdAt;
        const tb = b.isRetweeted && b.retweetedAt ? b.retweetedAt : b.createdAt;
        return tb - ta;
      });
      if (!parents.length) { tl.appendChild(emptyState('まだつぶやきがありません。\n思ったことを、そのまま放り込んでください。')); return; }
      parents.forEach(parent => {
        const wrapper = document.createElement('div');
        wrapper.className = 'tweet-card-wrapper';
        if (parent.isRetweeted) {
          const label = document.createElement('div');
          label.className = 'retweet-header-label';
          label.innerHTML = ICONS.retweet;
          const s = document.createElement('span');
          s.textContent = '自分がリポストしました';
          label.appendChild(s);
          wrapper.appendChild(label);
        }
        const kids = childrenOf(parent.id);
        wrapper.appendChild(createTweetCard(parent, { threadLine: kids.length > 0 }));
        kids.forEach((kid, i) => wrapper.appendChild(createTweetCard(kid, { threadLine: i < kids.length - 1 })));
        tl.appendChild(wrapper);
      });
    }
    function renderFlatList(container, tweets, emptyText) {
      container.textContent = '';
      if (!tweets.length) { container.appendChild(emptyState(emptyText)); return; }
      tweets.forEach(t => {
        const wrapper = document.createElement('div');
        wrapper.className = 'tweet-card-wrapper';
        wrapper.appendChild(createTweetCard(t, {}));
        container.appendChild(wrapper);
      });
    }
    function renderSearch() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const box = document.getElementById('searchResults');
      if (!q) { renderFlatList(box, [], 'キーワードや #タグ で検索できます。'); return; }
      const hits = allTweets.filter(t => (t.text || '').toLowerCase().includes(q))
        .sort((a, b) => b.createdAt - a.createdAt);
      renderFlatList(box, hits, '見つかりませんでした。');
    }
    function renderBookmarks() {
      const hits = allTweets.filter(t => t.isBookmarked).sort((a, b) => b.createdAt - a.createdAt);
      renderFlatList(document.getElementById('bookmarkTimeline'), hits, 'ブックマークしたつぶやきがここに並びます。');
    }
    function renderTags() {
      const bar = document.getElementById('tagListBar');
      bar.textContent = '';
      const stats = new Map();
      allTweets.forEach(t => {
        extractTags(t.text).forEach(tag => {
          const s = stats.get(tag) || { count: 0, latest: 0 };
          s.count++; s.latest = Math.max(s.latest, t.createdAt || 0);
          stats.set(tag, s);
        });
      });
      const tags = [...stats.entries()].sort((a, b) => b[1].count - a[1].count || b[1].latest - a[1].latest);
      if (activeTag && !stats.has(activeTag)) activeTag = '';
      tags.forEach(([tag, s]) => {
        const pill = document.createElement('button');
        pill.className = 'tag-pill' + (tag === activeTag ? ' active' : '');
        pill.dataset.action = 'tag-pill';
        pill.dataset.tag = tag;
        const n = document.createElement('span');
        n.textContent = '#' + tag;
        const c = document.createElement('span');
        c.className = 'tag-count';
        c.textContent = s.count;
        pill.appendChild(n); pill.appendChild(c);
        bar.appendChild(pill);
      });
      if (!tags.length) bar.appendChild(emptyState('まだタグがありません。\nつぶやきに #タグ を入れると、ここに集まります。'));
      const box = document.getElementById('tagTimeline');
      if (!activeTag) { renderFlatList(box, [], tags.length ? 'タグを選ぶと、そのつぶやきだけが並びます。' : ''); return; }
      const hits = allTweets.filter(t => extractTags(t.text).includes(activeTag))
        .sort((a, b) => b.createdAt - a.createdAt);
      renderFlatList(box, hits, '見つかりませんでした。');
    }
    function renderMedia() {
      const grid = document.getElementById('mediaGrid');
      grid.textContent = '';
      const items = [];
      allTweets.forEach(t => (t.images || []).forEach(src => items.push({ tweetId: t.id, src, createdAt: t.createdAt || 0 })));
      items.sort((a, b) => b.createdAt - a.createdAt);
      if (!items.length) { grid.appendChild(emptyState('画像つきのつぶやきがここに並びます。')); return; }
      items.forEach(it => {
        const d = document.createElement('div');
        d.className = 'media-item';
        d.dataset.action = 'media-item';
        d.dataset.id = it.tweetId;
        const img = document.createElement('img');
        img.src = it.src; img.alt = 'media';
        d.appendChild(img);
        grid.appendChild(d);
      });
    }
    function renderCurrentView() {
      if (currentView === 'home') renderHome();
      else if (currentView === 'search') renderSearch();
      else if (currentView === 'bookmarks') renderBookmarks();
      else if (currentView === 'tags') renderTags();
      else if (currentView === 'media') renderMedia();
      if (document.getElementById('detailModal').classList.contains('show') && activeDetailId != null) {
        if (getTweet(activeDetailId)) renderDetail(activeDetailId);
        else closeDetail();
      }
    }
    function switchTab(tabId, title) {
      currentView = tabId;
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
      document.getElementById('view-' + tabId).classList.add('active');
      document.getElementById('headerTitle').textContent = title;
      renderCurrentView();
    }

    /* ---------- 詳細（スレッド） ---------- */
    function getAncestors(targetId) {
      const out = [];
      let cur = getTweet(targetId);
      const guard = new Set();
      while (cur && cur.parentId && !guard.has(cur.id)) {
        guard.add(cur.id);
        const parent = getTweet(cur.parentId);
        if (!parent) break;
        out.unshift(parent);
        cur = parent;
      }
      return out;
    }
    function appendDescendants(parentId, container, level) {
      childrenOf(parentId).forEach(reply => {
        const wrap = document.createElement('div');
        if (level > 0) {
          wrap.className = 'nested-reply-wrapper';
          wrap.style.paddingLeft = Math.min(level * 14, 42) + 'px';
        }
        wrap.appendChild(createTweetCard(reply, { threadLine: childrenOf(reply.id).length > 0 }));
        container.appendChild(wrap);
        appendDescendants(reply.id, container, level + 1);
      });
    }
    function renderDetail(id) {
      const target = getTweet(id);
      if (!target) return;
      activeDetailId = id;
      const content = document.getElementById('detailModalContent');
      content.textContent = '';
      getAncestors(id).forEach(anc => content.appendChild(createTweetCard(anc, { threadLine: true })));
      content.appendChild(createTweetCard(target, { threadLine: childrenOf(id).length > 0, main: true }));
      const desc = document.createElement('div');
      desc.style.marginTop = '8px';
      appendDescendants(id, desc, 0);
      content.appendChild(desc);
    }
    function openDetail(id) {
      if (!getTweet(id)) return;
      renderDetail(id);
      document.getElementById('detailModal').classList.add('show');
    }
    function closeDetail() {
      document.getElementById('detailModal').classList.remove('show');
      activeDetailId = null;
    }

    /* ---------- 画像の取り込み（自動で縮小・圧縮） ---------- */
    function readAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(r.result);
        r.onerror = () => reject(r.error);
        r.readAsDataURL(file);
      });
    }
    async function compressImageFile(file) {
      if (file.type === 'image/gif') return readAsDataURL(file);
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = reject;
          i.src = url;
        });
        const MAX = 1600;
        const scale = Math.min(1, MAX / Math.max(img.naturalWidth, img.naturalHeight));
        if (scale >= 1 && file.size <= 800 * 1024) return await readAsDataURL(file);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL(file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.85);
      } finally {
        URL.revokeObjectURL(url);
      }
    }
    async function squareAvatarFile(file) {
      const url = URL.createObjectURL(file);
      try {
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = reject;
          i.src = url;
        });
        const side = Math.min(img.naturalWidth, img.naturalHeight);
        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 256;
        canvas.getContext('2d').drawImage(img,
          (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side,
          0, 0, 256, 256);
        return canvas.toDataURL('image/png');
      } finally {
        URL.revokeObjectURL(url);
      }
    }
    function renderPreview(kind) {
      const areaIds = { tweet: 'tweetImagePreviewArea', reply: 'replyImagePreviewArea', edit: 'editImagePreviewArea' };
      const area = document.getElementById(areaIds[kind]);
      const list = pendingImages[kind];
      area.textContent = '';
      if (!list.length) { area.style.display = 'none'; return; }
      area.style.display = 'block';
      const row = document.createElement('div');
      row.className = 'preview-row';
      list.forEach((src, idx) => {
        const box = document.createElement('div');
        box.className = 'image-preview-container';
        const img = document.createElement('img');
        img.src = src; img.alt = 'preview';
        const btn = document.createElement('button');
        btn.className = 'btn-remove-preview';
        btn.dataset.action = 'remove-image';
        btn.dataset.kind = kind;
        btn.dataset.index = idx;
        btn.textContent = '×';
        box.appendChild(img); box.appendChild(btn);
        row.appendChild(box);
      });
      area.appendChild(row);
    }
    async function handleImageFiles(kind, files) {
      const slots = 4 - pendingImages[kind].length;
      if (slots <= 0) { showToast('画像は4枚までです'); return; }
      for (const file of [...files].slice(0, slots)) {
        try { pendingImages[kind].push(await compressImageFile(file)); }
        catch (e) { console.error(e); showToast('画像を読み込めませんでした'); }
      }
      renderPreview(kind);
    }

    /* ---------- 投稿・返信・編集・削除 ---------- */
    function buildTweetData(text, images, parentId) {
      const now = new Date();
      const p = (n) => String(n).padStart(2, '0');
      return {
        text: text, images: images, time: p(now.getHours()) + ':' + p(now.getMinutes()),
        createdAt: now.getTime(), userName: currentUser.name, userHandle: currentUser.handle,
        userAvatar: currentUser.avatar, parentId: parentId || null,
        likeCount: 0, retweetCount: 0, replyCount: 0,
        isLiked: false, isRetweeted: false, isBookmarked: false, views: 1, retweetedAt: null
      };
    }
    async function postTweet(text, images, parentId) {
      const data = buildTweetData(text, images, parentId);
      data.id = await idbAddTweet(data);
      allTweets.push(data);
      return data;
    }
    async function submitTweet() {
      const ta = document.getElementById('tweetInput');
      const text = ta.value.trim();
      if (!text && !pendingImages.tweet.length) return;
      await postTweet(text, [...pendingImages.tweet], null);
      ta.value = '';
      pendingImages.tweet = [];
      renderPreview('tweet');
      renderCurrentView();
      showToast('つぶやきました');
    }
    function openReply(id) {
      const t = getTweet(id);
      if (!t) return;
      activeReplyTargetId = id;
      setAvatarInto(document.getElementById('replyTargetAvatar'), t.userAvatar || '');
      document.getElementById('replyTargetName').textContent = t.userName || currentUser.name;
      document.getElementById('replyTargetHandle').textContent = t.userHandle || currentUser.handle;
      document.getElementById('replyTargetText').textContent = t.text || '';
      document.getElementById('replyModal').classList.add('show');
      setTimeout(() => document.getElementById('replyInput').focus(), 50);
    }
    function closeReply() {
      document.getElementById('replyModal').classList.remove('show');
      document.getElementById('replyInput').value = '';
      pendingImages.reply = [];
      renderPreview('reply');
      activeReplyTargetId = null;
    }
    async function submitReply() {
      const ta = document.getElementById('replyInput');
      const text = ta.value.trim();
      if ((!text && !pendingImages.reply.length) || activeReplyTargetId == null) return;
      await postTweet(text, [...pendingImages.reply], activeReplyTargetId);
      closeReply();
      renderCurrentView();
      showToast('返信しました');
    }
    function openEdit(id) {
      const t = getTweet(id);
      if (!t) return;
      activeEditId = id;
      document.getElementById('editInput').value = t.text || '';
      pendingImages.edit = [...(t.images || [])];
      renderPreview('edit');
      document.getElementById('editModal').classList.add('show');
    }
    function closeEdit() {
      document.getElementById('editModal').classList.remove('show');
      pendingImages.edit = [];
      activeEditId = null;
    }
    async function submitEdit() {
      const t = getTweet(activeEditId);
      if (!t) { closeEdit(); return; }
      const text = document.getElementById('editInput').value.trim();
      if (!text && !pendingImages.edit.length) { showToast('本文か画像が必要です'); return; }
      t.text = text;
      t.images = [...pendingImages.edit];
      await idbPutTweet(t);
      closeEdit();
      renderCurrentView();
      showToast('編集しました');
    }
    function collectDescendantIds(id, out) {
      out.push(id);
      childrenOf(id).forEach(k => collectDescendantIds(k.id, out));
      return out;
    }
    async function deleteTweetFlow(id) {
      const ids = collectDescendantIds(id, []);
      const extra = ids.length - 1;
      const ok = await showConfirm(
        extra > 0 ? `このつぶやきと、返信${extra}件も一緒に削除しますか？` : 'このつぶやきを削除しますか？',
        '削除する', true);
      if (!ok) return;
      for (const delId of ids) await idbDeleteTweet(delId);
      allTweets = allTweets.filter(t => !ids.includes(t.id));
      renderCurrentView();
      showToast('削除しました');
    }
    async function toggleField(id, field, countField, onChange) {
      const t = getTweet(id);
      if (!t) return;
      t[field] = !t[field];
      if (countField) t[countField] = Math.max(0, (t[countField] || 0) + (t[field] ? 1 : -1));
      if (onChange) onChange(t);
      await idbPutTweet(t);
      renderCurrentView();
    }

    /* ---------- バックアップ／復元（形式は従来と互換） ---------- */
    async function exportData() {
      const settings = await idbGetAllSettings();
      const tweets = [...allTweets].sort((a, b) => (a.id || 0) - (b.id || 0));
      const backup = {
        version: '1.0', exportedAt: new Date().toISOString(),
        localStorage: {
          myX_name: localStorage.getItem('myX_name') || '自分',
          myX_handle: localStorage.getItem('myX_handle') || '@you'
        },
        settings: settings, tweets: tweets
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'MyX_backup_' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('バックアップを書き出しました');
    }
    function normalizeImportedTweet(raw) {
      if (!raw || typeof raw !== 'object') return null;
      const text = typeof raw.text === 'string' ? raw.text : '';
      const images = Array.isArray(raw.images) ? raw.images.filter(s => typeof s === 'string') : [];
      if (!text && !images.length) return null;
      return {
        text, images,
        time: typeof raw.time === 'string' ? raw.time : '',
        createdAt: typeof raw.createdAt === 'number' ? raw.createdAt : Date.now(),
        userName: typeof raw.userName === 'string' ? raw.userName : currentUser.name,
        userHandle: typeof raw.userHandle === 'string' ? raw.userHandle : currentUser.handle,
        userAvatar: typeof raw.userAvatar === 'string' ? raw.userAvatar : '',
        parentId: typeof raw.parentId === 'number' ? raw.parentId : null,
        likeCount: raw.likeCount || 0, retweetCount: raw.retweetCount || 0, replyCount: 0,
        isLiked: !!raw.isLiked, isRetweeted: !!raw.isRetweeted, isBookmarked: !!raw.isBookmarked,
        views: raw.views || 1, retweetedAt: raw.retweetedAt || null
      };
    }
    async function importData(file) {
      let data;
      try { data = JSON.parse(await file.text()); }
      catch (e) { showToast('ファイルの読み込みに失敗しました'); return; }
      if (!data || !Array.isArray(data.tweets)) { showToast('無効なバックアップファイルです'); return; }
      const ok = await showConfirm(`バックアップから復元しますか？\n（同じつぶやきは自動でスキップされます）`, '復元する', false);
      if (!ok) return;
      if (data.localStorage) {
        if (data.localStorage.myX_name) { localStorage.setItem('myX_name', data.localStorage.myX_name); currentUser.name = data.localStorage.myX_name; }
        if (data.localStorage.myX_handle) { localStorage.setItem('myX_handle', data.localStorage.myX_handle); currentUser.handle = data.localStorage.myX_handle; }
      }
      if (Array.isArray(data.settings)) {
        for (const s of data.settings) {
          if (s && typeof s.key === 'string') await idbReq('settings', 'readwrite', st => st.put(s));
        }
      }
      const idMap = new Map();
      const inserted = [];
      let added = 0, skipped = 0;
      for (const raw of data.tweets) {
        const t = normalizeImportedTweet(raw);
        if (!t) { skipped++; continue; }
        const oldId = typeof raw.id === 'number' ? raw.id : null;
        if (oldId != null) {
          const existing = getTweet(oldId);
          if (existing && existing.createdAt === t.createdAt && existing.text === t.text) { idMap.set(oldId, oldId); skipped++; continue; }
          if (!existing && !idMap.has(oldId)) {
            t.id = oldId;
            await idbPutTweet(t);
            idMap.set(oldId, oldId);
            allTweets.push(t); inserted.push(t); added++;
            continue;
          }
        }
        const newId = await idbAddTweet(t);
        t.id = newId;
        if (oldId != null) idMap.set(oldId, newId);
        allTweets.push(t); inserted.push(t); added++;
      }
      for (const t of inserted) {
        if (t.parentId != null) {
          const mapped = idMap.has(t.parentId) ? idMap.get(t.parentId) : (getTweet(t.parentId) ? t.parentId : null);
          if (mapped !== t.parentId) { t.parentId = mapped; await idbPutTweet(t); }
        }
      }
      const av = await idbGetSetting('userAvatar');
      if (av && typeof av.value === 'string') currentUser.avatar = av.value;
      initProfileUI();
      renderAllAvatars();
      renderCurrentView();
      showToast(`${added}件を取り込みました（重複${skipped}件スキップ）`);
    }

    /* ---------- イベント（委譲で一括） ---------- */
    function closeAllMenus(exceptId) {
      document.querySelectorAll('.dropdown-menu.show').forEach(m => {
        if (exceptId == null || m.id !== 'menu-' + exceptId) m.classList.remove('show');
      });
    }
    document.addEventListener('click', async (e) => {
      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) {
        closeAllMenus(null);
        const card = e.target.closest('.tweet-card');
        if (card && card.dataset.cardId) openDetail(Number(card.dataset.cardId));
        return;
      }
      const action = actionEl.dataset.action;
      const id = actionEl.dataset.id != null ? Number(actionEl.dataset.id) : null;
      switch (action) {
        case 'go-home': switchTab('home', 'ホーム'); break;
        case 'tab': switchTab(actionEl.dataset.tab, actionEl.dataset.title); break;
        case 'submit-tweet': await submitTweet(); break;
        case 'pick-images': document.getElementById(actionEl.dataset.kind + 'FileInput').click(); break;
        case 'remove-image': pendingImages[actionEl.dataset.kind].splice(Number(actionEl.dataset.index), 1); renderPreview(actionEl.dataset.kind); break;
        case 'menu': {
          const menu = document.getElementById('menu-' + id);
          const willShow = !menu.classList.contains('show');
          closeAllMenus(null);
          if (willShow) menu.classList.add('show');
          break;
        }
        case 'edit': closeAllMenus(null); openEdit(id); break;
        case 'delete': closeAllMenus(null); await deleteTweetFlow(id); break;
        case 'reply': openReply(id); break;
        case 'close-reply': closeReply(); break;
        case 'submit-reply': await submitReply(); break;
        case 'close-edit': closeEdit(); break;
        case 'submit-edit': await submitEdit(); break;
        case 'like': await toggleField(id, 'isLiked', 'likeCount'); break;
        case 'retweet': await toggleField(id, 'isRetweeted', 'retweetCount', t => { t.retweetedAt = t.isRetweeted ? Date.now() : null; }); break;
        case 'bookmark': await toggleField(id, 'isBookmarked', null); break;
        case 'share': {
          const t = getTweet(id);
          if (t && navigator.clipboard) {
            try { await navigator.clipboard.writeText(t.text || ''); showToast('つぶやき本文をコピーしました'); }
            catch (err) { showToast('コピーできませんでした'); }
          }
          break;
        }
        case 'hashtag':
          activeTag = actionEl.dataset.tag;
          switchTab('tags', 'タグ');
          break;
        case 'tag-pill': {
          const tag = actionEl.dataset.tag;
          activeTag = (activeTag === tag) ? '' : tag;
          renderTags();
          break;
        }
        case 'image': {
          const img = actionEl;
          document.getElementById('imageModalImg').src = img.src;
          document.getElementById('imageModal').classList.add('show');
          break;
        }
        case 'close-image': document.getElementById('imageModal').classList.remove('show'); break;
        case 'media-item': openDetail(id); break;
        case 'close-detail': closeDetail(); break;
        case 'pick-avatar': document.getElementById('avatarFileInput').click(); break;
        case 'export': await exportData(); break;
        case 'import': document.getElementById('importFileInput').click(); break;
      }
      if (!['menu'].includes(action)) closeAllMenus(action === 'menu' ? id : null);
    });
    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target.id === 'detailModal') closeDetail();
    });
    document.getElementById('tweetFileInput').addEventListener('change', async (e) => { await handleImageFiles('tweet', e.target.files); e.target.value = ''; });
    document.getElementById('replyFileInput').addEventListener('change', async (e) => { await handleImageFiles('reply', e.target.files); e.target.value = ''; });
    document.getElementById('editFileInput').addEventListener('change', async (e) => { await handleImageFiles('edit', e.target.files); e.target.value = ''; });
    document.getElementById('avatarFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      try {
        const dataUrl = await squareAvatarFile(file);
        currentUser.avatar = dataUrl;
        await idbPutSetting('userAvatar', dataUrl);
        renderAllAvatars();
        showToast('アバターを変更しました');
      } catch (err) { console.error(err); showToast('画像を読み込めませんでした'); }
    });
    document.getElementById('importFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      e.target.value = '';
      if (file) await importData(file);
    });
    let searchTimer = null;
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderSearch, 150);
    });
    document.getElementById('settingName').addEventListener('input', saveProfile);
    document.getElementById('settingHandle').addEventListener('input', saveProfile);
    function saveProfile() {
      currentUser.name = document.getElementById('settingName').value || '自分';
      currentUser.handle = document.getElementById('settingHandle').value || '@you';
      document.getElementById('displayProfileName').textContent = currentUser.name;
      document.getElementById('displayProfileHandle').textContent = currentUser.handle;
      localStorage.setItem('myX_name', currentUser.name);
      localStorage.setItem('myX_handle', currentUser.handle);
    }

    /* ---------- 起動 ---------- */
    (async function init() {
      try {
        db = await openDB();
        allTweets = (await idbGetAllTweets()) || [];
        const av = await idbGetSetting('userAvatar');
        if (av && typeof av.value === 'string') currentUser.avatar = av.value;
      } catch (err) {
        console.error(err);
        showToast('データベースを開けませんでした');
      }
      initProfileUI();
      renderAllAvatars();
      renderHome();
    })();
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
    }
  </script>
