<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My X</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #e7e9ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 600px;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 60px;
      position: relative;
    }
    header {
      position: sticky;
      top: 0;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    /* 画面切り替え */
    .view {
      display: none;
      flex: 1;
      flex-direction: column;
    }
    .view.active {
      display: flex;
    }

    /* タイムライン＆固定つぶやき投稿欄 */
    .post-box {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 12px;
      position: sticky;
      top: 45px; /* ヘッダーの直下に固定 */
      background-color: #000000;
      z-index: 9;
    }
    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #202327;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .avatar svg {
      width: 22px;
      height: 22px;
      fill: #71767b;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .post-input-area {
      flex: 1;
    }
    textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: #e7e9ea;
      font-size: 16px;
      resize: none;
      outline: none;
      min-height: 70px;
      font-family: inherit;
    }
    textarea::placeholder {
      color: #71767b;
    }
    .post-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 10px;
    }
    .btn-media-attach {
      background: none;
      border: none;
      color: #1d9bf0;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s;
    }
    .btn-media-attach:hover {
      background-color: rgba(29, 155, 240, 0.1);
    }
    .btn-media-attach svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .btn-submit {
      background-color: #1d9bf0;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s;
    }
    .btn-submit:active {
      transform: scale(0.95);
      background-color: #1a8cd8;
    }
    .timeline {
      flex: 1;
    }

    /* 添付画像プレビュー */
    .image-preview-container {
      position: relative;
      margin-top: 8px;
      margin-bottom: 8px;
      max-width: 100%;
      border-radius: 16px;
      overflow: hidden;
      display: inline-block;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .image-preview-container img {
      max-height: 200px;
      width: auto;
      max-width: 100%;
      display: block;
      object-fit: cover;
    }
    .btn-remove-preview {
      position: absolute;
      top: 6px;
      right: 6px;
      background-color: rgba(15, 20, 25, 0.75);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background-color 0.2s;
    }
    .btn-remove-preview:hover {
      background-color: rgba(15, 20, 25, 0.9);
    }

    /* ツイートカード内画像 */
    .tweet-attached-image {
      margin-top: 10px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-height: 380px;
    }
    .tweet-attached-image img {
      width: 100%;
      height: 100%;
      max-height: 380px;
      object-fit: cover;
      display: block;
    }

    /* ツイートカード＆ツリー構造 */
    .tweet-card-wrapper {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    .retweet-header-label {
      padding: 8px 16px 0 48px;
      font-size: 13px;
      font-weight: 700;
      color: #71767b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .retweet-header-label svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
    .tweet-card {
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      position: relative;
      transition: background-color 0.2s;
      cursor: pointer;
    }
    .tweet-card:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }
    .avatar-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }
    .thread-line {
      width: 2px;
      background-color: #333639;
      flex: 1;
      margin-top: 6px;
      margin-bottom: -12px;
    }
    .tweet-content {
      flex: 1;
      position: relative;
      min-width: 0;
    }
    .tweet-header {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 4px;
    }
    .user-name {
      font-weight: 700;
      color: #f7f9f9;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .user-handle, .tweet-time {
      color: #71767b;
      font-size: 14px;
      flex-shrink: 0;
    }
    .tweet-text {
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      color: #e7e9ea;
      margin-bottom: 6px;
    }

    /* アクションバー */
    .tweet-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 420px;
      margin-top: 8px;
      color: #71767b;
    }
    .action-btn {
      background: none;
      border: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      cursor: pointer;
      padding: 4px;
      border-radius: 50%;
      transition: color 0.2s;
    }
    .action-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .action-btn:hover {
      color: #1d9bf0;
    }
    .action-btn.retweeted {
      color: #00ba7c;
    }
    .action-btn.liked {
      color: #f91880;
    }
    .action-btn.liked svg {
      fill: #f91880;
    }
    .action-btn.bookmarked {
      color: #1d9bf0;
    }

    /* ハッシュタグのスタイル */
    .hashtag {
      color: #1d9bf0;
      cursor: pointer;
      font-weight: 500;
    }
    .hashtag:hover {
      text-decoration: underline;
    }

    /* 三点リーダー＆ドロップダウンメニュー */
    .menu-container {
      position: relative;
      margin-left: auto;
    }
    .btn-menu {
      background: none;
      border: none;
      color: #71767b;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, color 0.2s;
    }
    .btn-menu svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .btn-menu:hover {
      background-color: rgba(29, 155, 240, 0.1);
      color: #1d9bf0;
    }
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 28px;
      background-color: #000000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.1);
      z-index: 20;
      min-width: 140px;
      overflow: hidden;
    }
    .dropdown-menu.show {
      display: block;
    }
    .dropdown-item {
      padding: 12px 16px;
      color: #f4212e;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background-color 0.2s;
    }
    .dropdown-item svg {
      width: 16px;
      height: 16px;
      fill: #f4212e;
    }
    .dropdown-item:hover {
      background-color: rgba(244, 33, 46, 0.1);
    }

    /* 検索画面スタイル */
    .search-box-area {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .search-input-container {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-icon-inside {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      fill: #71767b;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background-color: #202327;
      border: 1px solid transparent;
      border-radius: 24px;
      color: #f7f9f9;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    .search-input:focus {
      border-color: #1d9bf0;
      background-color: #000000;
    }

    /* カレンダー画面スタイル */
    .calendar-container {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .calendar-stats-card {
      background: linear-gradient(135deg, rgba(29, 155, 240, 0.15) 0%, rgba(0, 0, 0, 0.4) 100%);
      border: 1px solid rgba(29, 155, 240, 0.3);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .calendar-stats-label {
      font-size: 13px;
      color: #71767b;
      font-weight: 600;
    }
    .calendar-stats-num {
      font-size: 28px;
      font-weight: 800;
      color: #1d9bf0;
      line-height: 1;
      margin-top: 4px;
    }
    .calendar-stats-unit {
      font-size: 14px;
      color: #f7f9f9;
      margin-left: 4px;
      font-weight: 500;
    }
    .calendar-header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .calendar-month-title {
      font-size: 16px;
      font-weight: 700;
      color: #f7f9f9;
    }
    .btn-cal-nav {
      background: #202327;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f7f9f9;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-cal-nav:hover {
      background-color: #2f3336;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }
    .cal-weekday {
      font-size: 12px;
      font-weight: 700;
      color: #71767b;
      padding-bottom: 6px;
    }
    .cal-day-cell {
      aspect-ratio: 1;
      border-radius: 12px;
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
    }
    .cal-day-cell.empty {
      background: transparent;
      cursor: default;
    }
    .cal-day-number {
      font-size: 14px;
      font-weight: 600;
      color: #e7e9ea;
    }
    .cal-day-cell.has-tweets {
      background-color: rgba(29, 155, 240, 0.1);
      border-color: rgba(29, 155, 240, 0.25);
    }
    .cal-day-badge {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #1d9bf0;
      margin-top: 3px;
    }
    .cal-day-cell.selected {
      border-color: #1d9bf0 !important;
      background-color: rgba(29, 155, 240, 0.25) !important;
    }
    .cal-day-cell.selected .cal-day-number {
      color: #ffffff;
      font-weight: 800;
    }
    .selected-date-title {
      padding: 12px 16px 8px 16px;
      font-size: 14px;
      font-weight: 700;
      color: #71767b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* タグ画面スタイル */
    .tag-header-area {
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-right: 8px;
    }
    .tag-list-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      flex: 1;
      scrollbar-width: none;
    }
    .tag-list-bar::-webkit-scrollbar {
      display: none;
    }
    .btn-manage-tags {
      background: none;
      border: none;
      color: #71767b;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.2s, background-color 0.2s;
    }
    .btn-manage-tags svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .btn-manage-tags:hover {
      color: #1d9bf0;
      background-color: rgba(29, 155, 240, 0.1);
    }
    .tag-pill {
      background-color: #202327;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      color: #71767b;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
      user-select: none;
    }
    .tag-pill-name {
      max-width: 90px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tag-pill-count {
      font-size: 11px;
      opacity: 0.6;
      flex-shrink: 0;
    }
    .tag-pill.active {
      background-color: #1d9bf0;
      color: #ffffff;
      border-color: #1d9bf0;
      font-weight: 700;
    }

    /* メディア一覧グリッド */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
    }
    .media-grid-item {
      aspect-ratio: 1;
      overflow: hidden;
      background-color: #202327;
      cursor: pointer;
      position: relative;
    }
    .media-grid-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .media-grid-item:hover img {
      transform: scale(1.05);
    }

    /* モーダル群 */
    .reply-modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 250;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 16px;
    }
    .reply-modal.show {
      display: flex;
    }
    .reply-modal-container {
      width: 100%;
      max-width: 550px;
      background-color: #000000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
    .reply-target-preview {
      display: flex;
      gap: 12px;
    }
    .reply-target-line {
      width: 2px;
      background-color: #333639;
      flex: 1;
      margin-top: 4px;
    }
    .reply-target-text {
      font-size: 14px;
      color: #71767b;
      margin-top: 4px;
      word-break: break-word;
    }

    .tag-modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 300;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 16px;
    }
    .tag-modal.show {
      display: flex;
    }
    .tag-modal-container {
      width: 100%;
      max-width: 500px;
      background-color: #0b0b0c;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      max-height: 80vh;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
    .tag-modal-header {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tag-modal-title {
      font-size: 16px;
      font-weight: 700;
      color: #f7f9f9;
    }
    .btn-tag-modal-close {
      background: #1d9bf0;
      border: none;
      color: #ffffff;
      padding: 6px 16px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .tag-modal-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .tag-modal-item {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      user-select: none;
      background-color: #0b0b0c;
      transition: background-color 0.2s;
    }

    /* 画像拡大（ライトボックス）モーダル */
    .image-modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 400;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .image-modal.show {
      display: flex;
    }
    .image-modal img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
    }

    /* ツイート詳細表示モーダル */
    .detail-modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 240;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 16px;
      overflow-y: auto;
    }
    .detail-modal.show {
      display: flex;
    }
    .detail-modal-container {
      width: 100%;
      max-width: 550px;
      background-color: #000000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }

    .page-content {
      padding: 16px;
    }
    .empty-state {
      text-align: center;
      color: #71767b;
      margin-top: 60px;
      padding-bottom: 40px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty-state svg {
      width: 48px;
      height: 48px;
      fill: #333639;
    }

    /* 設定UI */
    .profile-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .profile-avatar-large {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: #202327;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: opacity 0.2s;
    }
    .profile-avatar-large:hover {
      opacity: 0.85;
    }
    .profile-avatar-large svg {
      width: 36px;
      height: 36px;
      fill: #71767b;
    }
    .profile-avatar-large img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-edit-badge {
      position: absolute;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .profile-avatar-large:hover .avatar-edit-badge {
      opacity: 1;
    }
    .avatar-edit-badge svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }
    .profile-info {
      flex: 1;
    }
    .profile-info-name {
      font-size: 18px;
      font-weight: 700;
      color: #f7f9f9;
    }
    .profile-info-handle {
      font-size: 14px;
      color: #71767b;
    }

    .settings-section-title {
      font-size: 13px;
      font-weight: 700;
      color: #71767b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 0 0 10px 4px;
    }

    .settings-list {
      background-color: #0b0b0c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .settings-item {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .settings-item:last-child {
      border-bottom: none;
    }
    .settings-item-label {
      font-size: 12px;
      color: #1d9bf0;
      font-weight: 600;
    }
    .settings-item-input {
      background: transparent;
      border: none;
      color: #f7f9f9;
      font-size: 16px;
      font-weight: 500;
      outline: none;
      width: 100%;
      font-family: inherit;
    }

    /* バックアップ・復元ボタンUI */
    .settings-item-btn {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .settings-item-btn:last-child {
      border-bottom: none;
    }
    .settings-item-btn:hover {
      background-color: rgba(255, 255, 255, 0.03);
    }
    .settings-item-btn-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .settings-item-title {
      font-size: 15px;
      font-weight: 600;
      color: #e7e9ea;
    }
    .settings-item-sub {
      font-size: 12px;
      color: #71767b;
    }
    .settings-item-btn svg {
      width: 20px;
      height: 20px;
      fill: #71767b;
      flex-shrink: 0;
    }

    /* 画像トリミング用モダール */
    .crop-modal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(10px);
    }
    .crop-modal.show {
      display: flex;
    }
    .crop-container {
      width: 280px;
      height: 280px;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background-color: #111;
      touch-action: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    #cropCanvas {
      width: 100%;
      height: 100%;
      cursor: move;
    }
    .crop-controls {
      width: 280px;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .zoom-slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #71767b;
    }
    .zoom-slider {
      flex: 1;
      accent-color: #1d9bf0;
    }
    .crop-actions {
      display: flex;
      gap: 12px;
    }
    .btn-crop-cancel {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 24px;
      color: #f7f9f9;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-crop-save {
      flex: 1;
      padding: 12px;
      background: #1d9bf0;
      border: none;
      border-radius: 24px;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    /* 下部ナビゲーション */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 600px;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 56px;
      z-index: 100;
    }
    .nav-item {
      background: none;
      border: none;
      color: #71767b;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      width: 16.66%;
      height: 100%;
      transition: color 0.2s;
    }
    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .nav-item.active {
      color: #f7f9f9;
    }
    .nav-item.active svg {
      fill: #f7f9f9;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1 id="headerTitle">ホーム</h1>
    </header>

    <!-- 1. タイムライン -->
    <div id="view-home" class="view active">

        </button>
      </div>
      <div class="timeline" id="tagTimeline"></div>
    </div>

    <!-- 5. メディア一覧 -->
    <div id="view-media" class="view">
      <div class="media-grid" id="mediaGrid"></div>
    </div>

    <!-- 6. アカウント設定 -->
    <div id="view-settings" class="view">
      <div class="page-content">
        <div class="profile-card">
          <div class="profile-avatar-large" onclick="triggerAvatarSelect()">
            <div id="settingAvatarContainer" style="width:100%; height:100%;"></div>
            <div class="avatar-edit-badge">
              <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            </div>

              <span class="settings-item-sub">保存したファイルからデータを読み込みます</span>
            </div>
            <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
          </div>
        </div>
        <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importData(event)">
      </div>
    </div>

    <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">

    <!-- 返信（リプライ）用モーダル -->
    <div class="reply-modal" id="replyModal">

          <div class="avatar-column">
            <div class="avatar" id="replyTargetAvatar"></div>

          </div>

            <svg viewBox="0 0 24 24"><path d="M19.75 2H4.25C3.01 2 2 3.01 2 4.25v15.5C2 20.99 3.01 22 4.25 22h15.5c1.24 0 2.25-1.01 2.25-2.25V4.25C22 3.01 20.99 2 19.75 2zM4.25 3.5h15.5c.41 0 .75.34.75.75v12.56l-3.52-3.52c-.73-.73-1.91-.73-2.65 0L10.5 17.17l-2.09-2.09c-.73-.73-1.91-.73-2.65 0L3.5 17.34V4.25c0-.41.34-.75.75-.75zm0 17c-.19 0-.36-.07-.49-.2l3.41-3.41c.15-.15.39-.15.53 0l2.09 2.09c.39.39 1.02.39 1.41 0l4.38-4.38c.15-.15.39-.15.53 0l3.92 3.92H4.25zM15.5 10c1.38 0 2.5-1.12 2.5-2.5S16.88 5 15.5 5 13 6.12 13 7.5s1.12 2.5 2.5 2.5zm0-3.5c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1z"/></svg>

    <!-- 下部固定ナビゲーションバー（6項目） -->

        <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>

      </button>
      <button class="nav-item" onclick="switchTab('media', 'メディア', this)">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
      </button>

      </button>
    </nav>
  </div>

  <script>
    let db;
    let currentUser = {
      name: localStorage.getItem('myX_name') || '自分',
      handle: localStorage.getItem('myX_handle') || '@you',
      avatar: ''
    };
    let activeSelectedTag = '';
    let customTagOrder = [];
    let currentTagCounts = {};
    let activeReplyTargetTweet = null;

    // 投稿・リプライ添付用一時画像データ
    let currentTweetImages = [];
    let currentReplyImages = [];

    // カレンダー状態管理
    let calCurrentYear = new Date().getFullYear();
    let calCurrentMonth = new Date().getMonth();
    let calSelectedDateStr = '';

    const defaultAvatarSVG = `<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;

    function getAvatarHTML(avatarData) {
      const src = avatarData || currentUser.avatar;
      return src ? `<img src="${src}" alt="avatar">` : defaultAvatarSVG;
    }

    function renderAllAvatars() {
      const html = getAvatarHTML();
      document.querySelectorAll('.my-avatar-container').forEach(el => el.innerHTML = html);
      document.getElementById('settingAvatarContainer').innerHTML = html;

    function initProfileUI() {
      document.getElementById('settingName').value = currentUser.name;
      document.getElementById('settingHandle').value = currentUser.handle;
      document.getElementById('displayProfileName').textContent = currentUser.name;
      document.getElementById('displayProfileHandle').textContent = currentUser.handle;
    }

    const request = indexedDB.open('MyXDB', 2);

    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains('tweets')) {
        db.createObjectStore('tweets', { keyPath: 'id', autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
    };

    request.onsuccess = function(e) {
      db = e.target.result;
      loadSavedAvatar();
      loadSavedTagOrder();
      loadTweets();
    };

    function loadSavedAvatar() {
      const tx = db.transaction(['settings'], 'readonly');
      const store = tx.objectStore('settings');
      const getReq = store.get('userAvatar');
      getReq.onsuccess = function() {
        if (getReq.result) {
          currentUser.avatar = getReq.result.value;
        }
        initProfileUI();
        renderAllAvatars();
      };
    }

    function loadSavedTagOrder() {
      const tx = db.transaction(['settings'], 'readonly');
      const store = tx.objectStore('settings');
      const getReq = store.get('tagOrder');
      getReq.onsuccess = function() {
        if (getReq.result && Array.isArray(getReq.result.value)) {
          customTagOrder = getReq.result.value;
        }
      };
    }

    function saveTagOrderToIDB() {
      const tx = db.transaction(['settings'], 'readwrite');
      const store = tx.objectStore('settings');
      store.put({ key: 'tagOrder', value: customTagOrder });
    }

    function switchTab(tabId, title, btnElement) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

      document.getElementById(`view-${tabId}`).classList.add('active');
      if (btnElement) btnElement.classList.add('active');
      document.getElementById('headerTitle').textContent = title;

      if (tabId === 'home') {
        loadTweets();
      } else if (tabId === 'search') {
        performSearch();
      } else if (tabId === 'calendar') {
        renderCalendarView();
      } else if (tabId === 'tags') {
        renderTagsView();
      } else if (tabId === 'media') {
        renderMediaView();
      }
    }

      currentUser.name = document.getElementById('settingName').value || '自分';
      currentUser.handle = document.getElementById('settingHandle').value || '@you';
      
      document.getElementById('displayProfileName').textContent = currentUser.name;
      document.getElementById('displayProfileHandle').textContent = currentUser.handle;

      localStorage.setItem('myX_name', currentUser.name);
      localStorage.setItem('myX_handle', currentUser.handle);

    function saveAvatarToIDB(dataUrl) {
      const tx = db.transaction(['settings'], 'readwrite');
      const store = tx.objectStore('settings');
      store.put({ key: 'userAvatar', value: dataUrl });
    }

    /* バックアップ（書き出し）と復元（読み込み） */
    function exportData() {
      if (!db) return;
      const tx1 = db.transaction(['tweets'], 'readonly');
      const store1 = tx1.objectStore('tweets');
      const req1 = store1.getAll();

      req1.onsuccess = function() {
        const tweets = req1.result;
        const tx2 = db.transaction(['settings'], 'readonly');
        const store2 = tx2.objectStore('settings');
        const req2 = store2.getAll();

        req2.onsuccess = function() {
          const settings = req2.result;
          const backupData = {
            version: '1.0',
            exportedAt: new Date().toISOString(),
            localStorage: {
              myX_name: localStorage.getItem('myX_name') || '自分',
              myX_handle: localStorage.getItem('myX_handle') || '@you'
            },
            settings: settings,
            tweets: tweets
          };

          const jsonStr = JSON.stringify(backupData, null, 2);
          const blob = new Blob([jsonStr], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const dateStr = new Date().toISOString().slice(0, 10);
          a.href = url;
          a.download = `MyX_backup_${dateStr}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };
      };
    }

    function triggerImportData() {
      document.getElementById('importFileInput').click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (!data.tweets || !Array.isArray(data.tweets)) {
            alert('無効なバックアップファイルですわ。');
            return;
          }

          if (!confirm('データを復元・統合しますか？')) {
            e.target.value = '';
            return;
          }

          if (data.localStorage) {
            if (data.localStorage.myX_name) {
              localStorage.setItem('myX_name', data.localStorage.myX_name);
              currentUser.name = data.localStorage.myX_name;
            }
            if (data.localStorage.myX_handle) {
              localStorage.setItem('myX_handle', data.localStorage.myX_handle);
              currentUser.handle = data.localStorage.myX_handle;
            }
          }

          const txSettings = db.transaction(['settings'], 'readwrite');
          const storeSettings = txSettings.objectStore('settings');
          if (data.settings && Array.isArray(data.settings)) {
            data.settings.forEach(s => storeSettings.put(s));
          }

          const txTweets = db.transaction(['tweets'], 'readwrite');
          const storeTweets = txTweets.objectStore('tweets');
          
          let importedCount = 0;
          data.tweets.forEach(t => {
            storeTweets.put(t);
            importedCount++;
          });

          txTweets.oncomplete = function() {
            alert(`データと設定を無事に復元いたしましたわ！`);
            loadSavedAvatar();
            loadSavedTagOrder();
            initProfileUI();
            refreshCurrentView();
          };

        } catch (err) {
          alert('ファイルの読み込みに失敗いたしましたわ。');
          console.error(err);
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    }

    /* 画像選択・添付プレビューの処理 */
    function triggerTweetImageSelect() {
      document.getElementById('tweetFileInput').click();
    }

    function triggerReplyImageSelect() {
      document.getElementById('replyFileInput').click();
    }

    function handleTweetImageSelect(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const remainingSlots = 4 - currentTweetImages.length;
      const filesToProcess = files.slice(0, remainingSlots);

      let loadedCount = 0;
      filesToProcess.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          currentTweetImages.push(evt.target.result);
          loadedCount++;
          if (loadedCount === filesToProcess.length) {
            renderTweetImagePreview();
          }
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    }

    function handleReplyImageSelect(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const remainingSlots = 4 - currentReplyImages.length;
      const filesToProcess = files.slice(0, remainingSlots);

      let loadedCount = 0;
      filesToProcess.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(evt) {
          currentReplyImages.push(evt.target.result);
          loadedCount++;
          if (loadedCount === filesToProcess.length) {
            renderReplyImagePreview();
          }
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    }

            <div class="image-preview-container" style="position:relative;">

    function addTweet() {
      const textarea = document.getElementById('tweetInput');
      const text = textarea.value.trim();
      if (!text && currentTweetImages.length === 0) return;

      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

      const tweetData = {
        text: text,
        images: currentTweetImages,
        time: timeStr,
        createdAt: now.getTime(),
        userName: currentUser.name,
        userHandle: currentUser.handle,
        userAvatar: currentUser.avatar,
        parentId: null,
        likeCount: 0,
        retweetCount: 0,
        replyCount: 0,
        isLiked: false,
        isRetweeted: false,
        isBookmarked: false,
        views: 1,
        retweetedAt: null
      };

      const tx = db.transaction(['tweets'], 'readwrite');
      const store = tx.objectStore('tweets');
      const addRequest = store.add(tweetData);

      addRequest.onsuccess = function(e) {
        textarea.value = '';
        currentTweetImages = [];
        renderTweetImagePreview();
        loadTweets();
      };
    }

    function loadTweets() {
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = '';

      const tx = db.transaction(['tweets'], 'readonly');
      const store = tx.objectStore('tweets');
      const getAllRequest = store.getAll();

      getAllRequest.onsuccess = function() {
        const tweets = getAllRequest.result;

        const replyMap = {};
        tweets.forEach(t => {
          if (t.parentId) {
            replyMap[t.parentId] = (replyMap[t.parentId] || 0) + 1;
          }
        });
        tweets.forEach(t => {
          t.replyCount = replyMap[t.id] || 0;
        });

        const parentTweets = tweets.filter(t => !t.parentId);

        parentTweets.sort((a, b) => {
          const timeA = a.isRetweeted && a.retweetedAt ? a.retweetedAt : a.createdAt;
          const timeB = b.isRetweeted && b.retweetedAt ? b.retweetedAt : b.createdAt;
          return timeB - timeA;
        });

        parentTweets.forEach(parent => {
          const wrapper = document.createElement('div');
          wrapper.className = 'tweet-card-wrapper';

          if (parent.isRetweeted) {
            const rtLabel = document.createElement('div');
            rtLabel.className = 'retweet-header-label';
            rtLabel.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.42 4.42-1.41 1.41L5.5 7.71V15c0 1.66 1.34 3 3 3h7v2h-7c-2.76 0-5-2.24-5-5V7.71L1.49 9.71.08 8.3 4.5 3.88zM19.5 20.12l-4.42-4.42 1.41-1.41 2.01 2.01V9c0-1.66-1.34-3-3-3h-7V4h7c2.76 0 5 2.24 5 5v7.3l2.01-2.01 1.41 1.41-4.42 4.42z"/></svg> 自分がリポストしました`;
            wrapper.appendChild(rtLabel);
          }

          const childReplies = tweets.filter(t => t.parentId === parent.id).sort((a, b) => a.createdAt - b.createdAt);
          const hasChildren = childReplies.length > 0;

          wrapper.appendChild(createTweetCard(parent, hasChildren));

          childReplies.forEach((child, index) => {
            const isLast = index === childReplies.length - 1;
            wrapper.appendChild(createTweetCard(child, !isLast));
          });

          timeline.appendChild(wrapper);
        });
      };
    }

              </button>
              <div class="dropdown-menu" id="menu-${tweet.id}">

                  <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>

              <svg viewBox="0 0 24 24"><path d="M12 21.638h-.014C9.403 21.59 1.95 14.851 1.95 8.478 1.95 5.172 4.628 2.5 7.934 2.5c1.882 0 3.639.879 4.766 2.309C13.827 3.379 15.584 2.5 17.466 2.5c3.306 0 5.984 2.672 5.984 5.978 0 6.373-7.453 13.112-10.036 13.16H12z"/></svg>

    function formatTweetText(text) {
      if (!text) return '';
      const escaped = escapeHtml(text);
      return escaped.replace(/#([^\s\u3000]+)/g, function(match, tagName) {
        return `<span class="hashtag" onclick="clickHashtag(event, '${tagName}')">#${tagName}</span>`;
      });
    }

    function clickHashtag(event, tagName) {
      event.stopPropagation();
      activeSelectedTag = tagName;
      const tagNavBtn = document.querySelectorAll('.nav-item')[3];
      switchTab('tags', 'タグ', tagNavBtn);
    }

    function toggleLike(id) {
      const tx = db.transaction(['tweets'], 'readwrite');
      const store = tx.objectStore('tweets');
      const req = store.get(id);
      req.onsuccess = function() {
        const t = req.result;
        if (!t) return;
        t.isLiked = !t.isLiked;
        t.likeCount = t.isLiked ? (t.likeCount || 0) + 1 : Math.max(0, (t.likeCount || 1) - 1);
        store.put(t);
        tx.oncomplete = () => refreshCurrentView();
      };
    }

    function toggleRetweet(id) {
      const tx = db.transaction(['tweets'], 'readwrite');
      const store = tx.objectStore('tweets');
      const req = store.get(id);
      req.onsuccess = function() {
        const t = req.result;
        if (!t) return;
        t.isRetweeted = !t.isRetweeted;
        t.retweetCount = t.isRetweeted ? (t.retweetCount || 0) + 1 : Math.max(0, (t.retweetCount || 1) - 1);
        t.retweetedAt = t.isRetweeted ? Date.now() : null;
        store.put(t);
        tx.oncomplete = () => refreshCurrentView();
      };
    }

    function toggleBookmark(id) {
      const tx = db.transaction(['tweets'], 'readwrite');
      const store = tx.objectStore('tweets');
      const req = store.get(id);
      req.onsuccess = function() {
        const t = req.result;
        if (!t) return;
        t.isBookmarked = !t.isBookmarked;
        store.put(t);
        tx.oncomplete = () => refreshCurrentView();
      };
    }

    function refreshCurrentView() {
      if (document.getElementById('view-calendar').classList.contains('active')) {
        renderCalendarTimeline();
      } else if (document.getElementById('view-tags').classList.contains('active')) {
        renderTagsView();
      } else if (document.getElementById('view-media').classList.contains('active')) {
        renderMediaView();
      } else {
        loadTweets();
      }
    }

    function shareTweet(text) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
        alert('つぶやき本文をコピーしましたわ！');
      }
    }

    function openReplyModal(id) {
      const tx = db.transaction(['tweets'], 'readonly');
      const store = tx.objectStore('tweets');
      const req = store.get(id);
      req.onsuccess = function() {
        activeReplyTargetTweet = req.result;
        if (!activeReplyTargetTweet) return;

        document.getElementById('replyTargetName').textContent = activeReplyTargetTweet.userName || currentUser.name;
        document.getElementById('replyTargetHandle').textContent = activeReplyTargetTweet.userHandle || currentUser.handle;
        document.getElementById('replyTargetText').textContent = activeReplyTargetTweet.text;
        document.getElementById('replyTargetAvatar').innerHTML = getAvatarHTML(activeReplyTargetTweet.userAvatar);

        document.getElementById('replyInput').value = '';
        currentReplyImages = [];
        renderReplyImagePreview();
        document.getElementById('replyModal').classList.add('show');
      };
    }

    function closeReplyModal() {
      document.getElementById('replyModal').classList.remove('show');
      activeReplyTargetTweet = null;
      currentReplyImages = [];
      renderReplyImagePreview();
    }

    function submitReply() {
      const text = document.getElementById('replyInput').value.trim();
      if (!text && currentReplyImages.length === 0) return;
      if (!activeReplyTargetTweet) return;

      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

      const replyData = {
        text: text,
        images: currentReplyImages,
        time: timeStr,
        createdAt: now.getTime(),
        userName: currentUser.name,
        userHandle: currentUser.handle,
        userAvatar: currentUser.avatar,
        parentId: activeReplyTargetTweet.id,
        likeCount: 0,
        retweetCount: 0,
        replyCount: 0,
        isLiked: false,
        isRetweeted: false,
        isBookmarked: false,
        views: 1
      };

      const tx = db.transaction(['tweets'], 'readwrite');
      const store = tx.objectStore('tweets');
      store.add(replyData);

      tx.oncomplete = function() {
        closeReplyModal();
        refreshCurrentView();
      };
    }

    /* カレンダー画面のロジック */
    let allCalendarTweets = [];

    function renderCalendarView() {
      if (!db) return;

      const tx = db.transaction(['tweets'], 'readonly');
      const store = tx.objectStore('tweets');
      const getAllReq = store.getAll();

      getAllReq.onsuccess = function() {
        allCalendarTweets = getAllReq.result;
        drawCalendar();
      };
    }

    function changeCalMonth(delta) {
      calCurrentMonth += delta;
      if (calCurrentMonth < 0) {
        calCurrentMonth = 11;
        calCurrentYear--;
      } else if (calCurrentMonth > 11) {
        calCurrentMonth = 0;
        calCurrentYear++;
      }
      drawCalendar();
    }

    function drawCalendar() {
      const year = calCurrentYear;
      const month = calCurrentMonth;

      document.getElementById('calDisplayMonth').textContent = `${year}年 ${month + 1}月`;
      document.getElementById('calMonthLabel').textContent = `${year}年${month + 1}月のつぶやき`;

      const tweetCountByDate = {};
      let monthTotal = 0;

      allCalendarTweets.forEach(t => {
        const d = new Date(t.createdAt);
        if (d.getFullYear() === year && d.getMonth() === month) {
          monthTotal++;
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const key = `${yyyy}-${mm}-${dd}`;
          tweetCountByDate[key] = (tweetCountByDate[key] || 0) + 1;
        }
      });

      document.getElementById('calTotalCount').textContent = monthTotal;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      weekdays.forEach(w => {
        const el = document.createElement('div');
        el.className = 'cal-weekday';
        el.textContent = w;
        grid.appendChild(el);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-day-cell empty';
        grid.appendChild(empty);
      }

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      if (!calSelectedDateStr) {
        calSelectedDateStr = todayStr;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const count = tweetCountByDate[dayStr] || 0;

        const cell = document.createElement('div');
        let classes = 'cal-day-cell';
        if (count > 0) classes += ' has-tweets';
        if (dayStr === calSelectedDateStr) classes += ' selected';
        cell.className = classes;

        cell.innerHTML = `
          <span class="cal-day-number">${day}</span>
          ${count > 0 ? '<div class="cal-day-badge"></div>' : ''}
        `;

        cell.onclick = () => {
          calSelectedDateStr = dayStr;
          drawCalendar();
        };

        grid.appendChild(cell);
      }

      renderCalendarTimeline();
    }

    function renderCalendarTimeline() {
      const container = document.getElementById('calendarTimeline');
      container.innerHTML = '';

      if (!calSelectedDateStr) return;

      const parts = calSelectedDateStr.split('-');
      document.getElementById('selectedDateTitle').textContent = `${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日のつぶやき`;

      const dayTweets = allCalendarTweets.filter(t => {
        const d = new Date(t.createdAt);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}` === calSelectedDateStr;
      });

      if (dayTweets.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
            <div>この日のつぶやきはありませんわ</div>
          </div>`;
      } else {
        dayTweets.sort((a, b) => b.createdAt - a.createdAt);
        dayTweets.forEach(t => {
          container.appendChild(createTweetCard(t, false));
        });
      }
    }

    /* 検索処理 */
    function performSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const resultsContainer = document.getElementById('searchResults');
      resultsContainer.innerHTML = '';

      if (!db) return;

      const tx = db.transaction(['tweets'], 'readonly');
      const store = tx.objectStore('tweets');
      const getAllReq = store.getAll();

      getAllReq.onsuccess = function() {
        let tweets = getAllReq.result;
        tweets.sort((a, b) => b.createdAt - a.createdAt);

        const filtered = tweets.filter(t => {
          if (!query) return true;
          return t.text.toLowerCase().includes(query);
        });

        if (filtered.length === 0) {
          resultsContainer.innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              <div>該当するつぶやきが見つかりませんでしたわ</div>
            </div>`;
        } else {
          filtered.forEach(t => {
            resultsContainer.appendChild(createTweetCard(t, false));
          });
        }
      };
    }

    /* タグ画面の描写処理 */
    function renderTagsView() {
      if (!db) return;

      const tx = db.transaction(['tweets'], 'readonly');
      const store = tx.objectStore('tweets');
      const getAllReq = store.getAll();

      getAllReq.onsuccess = function() {
        const tweets = getAllReq.result;
        tweets.sort((a, b) => b.createdAt - a.createdAt);

        currentTagCounts = {};
        const foundTagsInPosts = [];
        tweets.forEach(t => {
          const matches = t.text.match(/#([^\s\u3000]+)/g);
          if (matches) {
            matches.forEach(rawTag => {
              const tag = rawTag.substring(1);
              if (!currentTagCounts[tag]) {
                currentTagCounts[tag] = 0;
                foundTagsInPosts.push(tag);
              }
              currentTagCounts[tag]++;
            });
          }
        });

        const tagListBar = document.getElementById('tagListBar');
        tagListBar.innerHTML = '';

        const allFoundTags = Object.keys(currentTagCounts);

        if (allFoundTags.length === 0) {
          document.querySelector('.tag-header-area').style.display = 'none';
          document.getElementById('tagTimeline').innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24"><path d="M20 10V8h-4V4h-2v4h-4V4H8v4H4v2h4v4H4v2h4v4h2v-4h4v4h2v-4h4v-2h-4v-4h4zm-6 4h-4v-4h4v4z"/></svg>
              <div>まだ #タグ 付きの投稿がありませんわ</div>
            </div>`;
          return;
        }

        document.querySelector('.tag-header-area').style.display = 'flex';

        foundTagsInPosts.forEach(tag => {
          if (!customTagOrder.includes(tag)) {
            customTagOrder.push(tag);
          }
        });

        customTagOrder = customTagOrder.filter(tag => currentTagCounts[tag] > 0);
        saveTagOrderToIDB();

        if (!activeSelectedTag || !currentTagCounts[activeSelectedTag]) {
          activeSelectedTag = customTagOrder[0];
        }

        customTagOrder.forEach((tag) => {
          const pill = document.createElement('div');
          pill.className = `tag-pill ${tag === activeSelectedTag ? 'active' : ''}`;
          pill.onclick = () => {
            activeSelectedTag = tag;
            renderTagsView();
          };

          pill.innerHTML = `
            <span class="tag-pill-name">#${escapeHtml(tag)}</span>
            <span class="tag-pill-count">${currentTagCounts[tag]}</span>
          `;
          tagListBar.appendChild(pill);
        });

        const tagTimeline = document.getElementById('tagTimeline');
        tagTimeline.innerHTML = '';

        const filtered = tweets.filter(t => t.text.includes(`#${activeSelectedTag}`));
        filtered.forEach(t => {
          tagTimeline.appendChild(createTweetCard(t, false));
        });
      };
    }

    /* メディア画面の描写処理 */
    function renderMediaView() {
      if (!db) return;

      const tx = db.transaction(['tweets'], 'readonly');
      const store = tx.objectStore('tweets');
      const getAllReq = store.getAll();

      getAllReq.onsuccess = function() {
        const tweets = getAllReq.result;
        tweets.sort((a, b) => b.createdAt - a.createdAt);

        const grid = document.getElementById('mediaGrid');
        grid.innerHTML = '';

        let allImages = [];
        tweets.forEach(t => {
          const imgs = t.images || (t.image ? [t.image] : []);
          imgs.forEach(img => allImages.push(img));
        });

        if (allImages.length === 0) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column: span 3;">
              <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
              <div>まだ画像付きの投稿がありませんわ</div>
            </div>`;
          return;
        }

        allImages.forEach(imgSrc => {
          const item = document.createElement('div');
          item.className = 'media-grid-item';
          item.innerHTML = `<img src="${imgSrc}" alt="media">`;
          item.onclick = () => openImageModal(null, imgSrc);
          grid.appendChild(item);
        });
      };
    }

    /* タグ管理モーダル処理 */
    function openTagManageModal() {
      const modal = document.getElementById('tagManageModal');
      const listContainer = document.getElementById('tagModalList');
      listContainer.innerHTML = '';

      customTagOrder.forEach((tag, index) => {
        const item = document.createElement('div');
        item.className = 'tag-modal-item';
        item.draggable = true;
        item.dataset.index = index;

        item.innerHTML = `
          <div class="tag-modal-item-left">
            <span class="tag-modal-handle">
              <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </span>
            <span class="tag-modal-name">#${escapeHtml(tag)}</span>
          </div>
          <span class="tag-modal-count">${currentTagCounts[tag]}件</span>
        `;

        bindVerticalDragEvents(item);
        listContainer.appendChild(item);
      });

      modal.classList.add('show');
    }

    function closeTagManageModal() {
      document.getElementById('tagManageModal').classList.remove('show');
      renderTagsView();
    }

    let verticalDraggedIndex = null;

    function bindVerticalDragEvents(item) {
      item.addEventListener('dragstart', (e) => {
        verticalDraggedIndex = parseInt(item.dataset.index);
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });

      item.addEventListener('drop', (e) => {
        e.preventDefault();
        const targetIndex = parseInt(item.dataset.index);
        if (verticalDraggedIndex !== null && verticalDraggedIndex !== targetIndex) {
          reorderTagsModal(verticalDraggedIndex, targetIndex);
        }
      });

      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        verticalDraggedIndex = null;
      });

      let touchItem = null;

      item.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchItem = item;
          verticalDraggedIndex = parseInt(item.dataset.index);
        }
      }, { passive: true });

      item.addEventListener('touchmove', (e) => {
        if (!touchItem) return;
        const currentY = e.touches[0].clientY;
        const targetEl = document.elementFromPoint(e.touches[0].clientX, currentY);
        if (targetEl) {
          const targetItem = targetEl.closest('.tag-modal-item');
          if (targetItem && targetItem !== touchItem) {
            const targetIndex = parseInt(targetItem.dataset.index);
            if (verticalDraggedIndex !== null && targetIndex !== undefined && verticalDraggedIndex !== targetIndex) {
              reorderTagsModal(verticalDraggedIndex, targetIndex);
              verticalDraggedIndex = targetIndex;
            }
          }
        }
      }, { passive: true });

      item.addEventListener('touchend', () => {
        touchItem = null;
        verticalDraggedIndex = null;
      });
    }

    function reorderTagsModal(fromIndex, toIndex) {
      const movedTag = customTagOrder.splice(fromIndex, 1)[0];
      customTagOrder.splice(toIndex, 0, movedTag);
      saveTagOrderToIDB();
      openTagManageModal();
    }

    function toggleMenu(event, id) {
      event.stopPropagation();
      const targetMenu = document.getElementById(`menu-${id}`);
      const isShow = targetMenu.classList.contains('show');
      document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
      if (!isShow) {
        targetMenu.classList.add('show');
      }
    }

    document.addEventListener('click', function() {
      document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
    });

    function deleteTweet(id) {
      if (!confirm('この投稿を削除しますか？')) return;

      const tx = db.transaction(['tweets'], 'readwrite');
      const store = tx.objectStore('tweets');
      store.delete(id);

      tx.oncomplete = function() {
        refreshCurrentView();
      };
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    /* アバター画像選択・自由なドラッグ＆トリミング機能 */
    let loadedImage = null;
    let cropScale = 1;
    let cropPosX = 0;
    let cropPosY = 0;
    let isDraggingCrop = false;
    let dragStartX = 0;
    let dragStartY = 0;

    function triggerAvatarSelect() {
      document.getElementById('avatarFileInput').click();
    }

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        loadedImage = new Image();
        loadedImage.onload = function() {
          setupCropCanvas();
          document.getElementById('cropModal').classList.add('show');
        };
        loadedImage.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    function setupCropCanvas() {
      cropScale = 1;
      document.getElementById('zoomSlider').value = 1;
      
      const canvas = document.getElementById('cropCanvas');
      const initialScale = Math.max(canvas.width / loadedImage.width, canvas.height / loadedImage.height);
      cropPosX = (canvas.width - loadedImage.width * initialScale) / 2;
      cropPosY = (canvas.height - loadedImage.height * initialScale) / 2;

      drawCrop();
      bindCropEvents();
    }

    function drawCrop() {
      const canvas = document.getElementById('cropCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!loadedImage) return;

      const baseScale = Math.max(canvas.width / loadedImage.width, canvas.height / loadedImage.height);
      const currentScale = baseScale * cropScale;
      const w = loadedImage.width * currentScale;
      const h = loadedImage.height * currentScale;

      ctx.drawImage(loadedImage, cropPosX, cropPosY, w, h);

      // マスク（外側を暗く、円枠を青色描画）
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.beginPath();
      ctx.rect(0, 0, canvas.width, canvas.height);
      ctx.arc(canvas.width / 2, canvas.height / 2, 110, 0, Math.PI * 2, true);
      ctx.fill();

      ctx.strokeStyle = '#1d9bf0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 110, 0, Math.PI * 2);
      ctx.stroke();
    }

    function onZoomChange() {
      cropScale = parseFloat(document.getElementById('zoomSlider').value);
      drawCrop();
    }

    function bindCropEvents() {
      const canvas = document.getElementById('cropCanvas');

      const getPos = (e) => {
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      };

      const startDrag = (e) => {
        isDraggingCrop = true;
        const pos = getPos(e);
        dragStartX = pos.x - cropPosX;
        dragStartY = pos.y - cropPosY;
      };

      const moveDrag = (e) => {
        if (!isDraggingCrop) return;
        if (e.cancelable) e.preventDefault();
        const pos = getPos(e);
        cropPosX = pos.x - dragStartX;
        cropPosY = pos.y - dragStartY;
        drawCrop();
      };

      const endDrag = () => { isDraggingCrop = false; };

      canvas.onmousedown = startDrag;
      window.onmousemove = moveDrag;
      window.onmouseup = endDrag;

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          startDrag(e);
        }
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        if (isDraggingCrop && e.touches.length === 1) {
          moveDrag(e);
        }
      }, { passive: false });

      canvas.addEventListener('touchend', endDrag);
    }

    function closeCropModal() {
      document.getElementById('cropModal').classList.remove('show');
    }

    function saveCroppedAvatar() {
      const outputCanvas = document.createElement('canvas');
      outputCanvas.width = 200;
      outputCanvas.height = 200;
      const ctx = outputCanvas.getContext('2d');

      const srcCanvas = document.getElementById('cropCanvas');
      ctx.beginPath();
      ctx.arc(100, 100, 100, 0, Math.PI * 2);
      ctx.clip();

      ctx.drawImage(
        srcCanvas,
        30, 30, 220, 220,
        0, 0, 200, 200
      );

      const croppedDataUrl = outputCanvas.toDataURL('image/png');
      currentUser.avatar = croppedDataUrl;

      saveAvatarToIDB(croppedDataUrl);
      renderAllAvatars();
      closeCropModal();
    }

    /* 画像拡大モーダル制御 */
    function openImageModal(event, src) {
      if (event) event.stopPropagation();
      document.getElementById('imageModalImg').src = src;
      document.getElementById('imageModal').classList.add('show');
    }

    function closeImageModal() {
      document.getElementById('imageModal').classList.remove('show');
    }

    /* ツイート詳細（単体スレッド表示）モーダル制御 */
    function openDetailModal(id) {
      const tx = db.transaction(['tweets'], 'readonly');
      const store = tx.objectStore('tweets');
      const getAllReq = store.getAll();

      getAllReq.onsuccess = function() {
        const tweets = getAllReq.result;
        const target = tweets.find(t => t.id === id);
        if (!target) return;

        const content = document.getElementById('detailModalContent');
        content.innerHTML = '';

        if (target.parentId) {
          const parent = tweets.find(t => t.id === target.parentId);
          if (parent) {
            content.appendChild(createTweetCard(parent, true));
          }
        }

        content.appendChild(createTweetCard(target, false));

        const replies = tweets.filter(t => t.parentId === target.id).sort((a, b) => a.createdAt - b.createdAt);
        replies.forEach(r => {
          content.appendChild(createTweetCard(r, false));
        });

        document.getElementById('detailModal').classList.add('show');
      };
    }

    function closeDetailModal(event) {
      if (event.target.id === 'detailModal') {
        document.getElementById('detailModal').classList.remove('show');
      }
    }

    function closeDetailModalDirect() {
      document.getElementById('detailModal').classList.remove('show');
    }

    // Service Workerの登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>

    /* 検索画面スタイル */

    .cal-day-cell.empty {

    .selected-date-title {

      font-weight: 700;

    /* タグ画面スタイル */

      justify-content: center;
      flex-shrink: 0;

    .tag-pill {

    /* メディア一覧グリッド */
    .media-grid {

      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;

    .media-grid-item {

  <script>
    let db;
    let currentUser = {
      name: localStorage.getItem('myX_name') || '自分',
      handle: localStorage.getItem('myX_handle') || '@you',
      avatar: ''
    };
    let activeSelectedTag = '';
    let customTagOrder = [];
    let currentTagCounts = {};
    let activeReplyTargetTweet = null;

    // 投稿・リプライ添付用一時画像データ
    let currentTweetImages = [];
    let currentReplyImages = [];

    // カレンダー状態管理
    let calCurrentYear = new Date().getFullYear();
    let calCurrentMonth = new Date().getMonth();
    let calSelectedDateStr = '';

    const defaultAvatarSVG = `<svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;

    function getAvatarHTML(avatarData) {
      const src = avatarData || currentUser.avatar;
      return src ? `<img src="${src}" alt="avatar">` : defaultAvatarSVG;
    }

    function renderAllAvatars() {
      const html = getAvatarHTML();
      document.querySelectorAll('.my-avatar-container').forEach(el => el.innerHTML = html);
      document.getElementById('settingAvatarContainer').innerHTML = html;
    }

    function initProfileUI() {
      document.getElementById('settingName').value = currentUser.name;
      document.getElementById('settingHandle').value = currentUser.handle;
      document.getElementById('displayProfileName').textContent = currentUser.name;
      document.getElementById('displayProfileHandle').textContent = currentUser.handle;
    }

    const request = indexedDB.open('MyXDB', 2);

    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains('tweets')) {
        db.createObjectStore('tweets', { keyPath: 'id', autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('settings')) {
        db.createObjectStore('settings', { keyPath: 'key' });
      }
    };

    request.onsuccess = function(e) {
      db = e.target.result;
      loadSavedAvatar();
      loadSavedTagOrder();
      loadTweets();
    };

    function loadSavedAvatar() {
      const tx = db.transaction(['settings'], 'readonly');
      const store = tx.objectStore('settings');
      const getReq = store.get('userAvatar');
      getReq.onsuccess = function() {
        if (getReq.result) {
          currentUser.avatar = getReq.result.value;
        }
        initProfileUI();
        renderAllAvatars();
      };
    }

    function loadSavedTagOrder() {
      const tx = db.transaction(['settings'], 'readonly');
      const store = tx.objectStore('settings');
      const getReq = store.get('tagOrder');
      getReq.onsuccess = function() {
        if (getReq.result && Array.isArray(getReq.result.value)) {
          customTagOrder = getReq.result.value;
        }
      };
    }

    function saveTagOrderToIDB() {
      const tx = db.transaction(['settings'], 'readwrite');
      const store = tx.objectStore('settings');
      store.put({ key: 'tagOrder', value: customTagOrder });
    }

    function switchTab(tabId, title, btnElement) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

      document.getElementById(`view-${tabId}`).classList.add('active');
      if (btnElement) btnElement.classList.add('active');
      document.getElementById('headerTitle').textContent = title;

      if (tabId === 'home') {
        loadTweets();
      } else if (tabId === 'search') {
        performSearch();
      } else if (tabId === 'calendar') {
        renderCalendarView();
      } else if (tabId === 'tags') {
        renderTagsView();
      } else if (tabId === 'media') {
        renderMediaView();
      }
    }

    function saveProfile() {
      currentUser.name = document.getElementById('settingName').value || '自分';
      currentUser.handle = document.getElementById('settingHandle').value || '@you';
      
      document.getElementById('displayProfileName').textContent = currentUser.name;
      document.getElementById('displayProfileHandle').textContent = currentUser.handle;

      localStorage.setItem('myX_name', currentUser.name);
      localStorage.setItem('myX_handle', currentUser.handle);
    }

    function saveAvatarToIDB(dataUrl) {
      const tx = db.transaction(['settings'], 'readwrite');
      const store = tx.objectStore('settings');
      store.put({ key: 'userAvatar', value: dataUrl });
    }

    /* 画像選択・添付プレビューの処理 */
    function triggerTweetImageSelect() {
      document.getElementById('tweetFileInput').click();
    }

    function triggerReplyImageSelect() {
      document.getElementById('replyFileInput').click();
    }

   function handleTweetImageSelect(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;

  const remainingSlots = 4 - currentTweetImages.length;
  const filesToProcess = files.slice(0, remainingSlots);

  let loadedCount = 0;
  filesToProcess.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(evt) {
      currentTweetImages.push(evt.target.result);
      loadedCount++;
      if (loadedCount === filesToProcess.length) {
        renderTweetImagePreview();
      }
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

function handleReplyImageSelect(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;

  const remainingSlots = 4 - currentReplyImages.length;
  const filesToProcess = files.slice(0, remainingSlots);

  let loadedCount = 0;
  filesToProcess.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(evt) {
      currentReplyImages.push(evt.target.result);
      loadedCount++;
      if (loadedCount === filesToProcess.length) {
        renderReplyImagePreview();
      }
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

    function renderTweetImagePreview() {
  const container = document.getElementById('tweetImagePreviewArea');
  if (currentTweetImages.length === 0) {
    container.style.display = 'none';
    container.innerHTML = '';
    return;
  }
  container.style.display = 'block';
  container.innerHTML = `
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;">
      ${currentTweetImages.map((imgSrc, idx) => `

    function loadTweets() {
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = '';

      const tx = db.transaction(['tweets'], 'readonly');
      const store = tx.objectStore('tweets');
      const getAllRequest = store.getAll();

      getAllRequest.onsuccess = function() {
        const tweets = getAllRequest.result;

        const replyMap = {};
        tweets.forEach(t => {
          if (t.parentId) {
            replyMap[t.parentId] = (replyMap[t.parentId] || 0) + 1;
          }
        });
        tweets.forEach(t => {
          t.replyCount = replyMap[t.id] || 0;
        });

        const parentTweets = tweets.filter(t => !t.parentId);

        parentTweets.sort((a, b) => {
          const timeA = a.isRetweeted && a.retweetedAt ? a.retweetedAt : a.createdAt;
          const timeB = b.isRetweeted && b.retweetedAt ? b.retweetedAt : b.createdAt;
          return timeB - timeA;
        });

        parentTweets.forEach(parent => {
          const wrapper = document.createElement('div');
          wrapper.className = 'tweet-card-wrapper';

          if (parent.isRetweeted) {
            const rtLabel = document.createElement('div');
            rtLabel.className = 'retweet-header-label';
            rtLabel.innerHTML = `<svg viewBox="0 0 24 24"><path d="M4.5 3.88l4.42 4.42-1.41 1.41L5.5 7.71V15c0 1.66 1.34 3 3 3h7v2h-7c-2.76 0-5-2.24-5-5V7.71L1.49 9.71.08 8.3 4.5 3.88zM19.5 20.12l-4.42-4.42 1.41-1.41 2.01 2.01V9c0-1.66-1.34-3-3-3h-7V4h7c2.76 0 5 2.24 5 5v7.3l2.01-2.01 1.41 1.41-4.42 4.42z"/></svg> 自分がリポストしました`;
            wrapper.appendChild(rtLabel);
          }

          const childReplies = tweets.filter(t => t.parentId === parent.id).sort((a, b) => a.createdAt - b.createdAt);
          const hasChildren = childReplies.length > 0;

          wrapper.appendChild(createTweetCard(parent, hasChildren));

          childReplies.forEach((child, index) => {
            const isLast = index === childReplies.length - 1;
            wrapper.appendChild(createTweetCard(child, !isLast));
          });

          timeline.appendChild(wrapper);
        });
      };
    }
