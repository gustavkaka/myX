    function formatTweetText(text) {
      if (!text) return '';
      const escaped = escapeHtml(text);
      return escaped.replace(/#([^\s\u3000]+)/g, function(match, tagName) {
        return `<span class="hashtag" onclick="clickHashtag(event, '${tagName}')">#${tagName}</span>`;
      });
    }

    function clickHashtag(event, tagName) {
      event.stopPropagation();
      activeSelectedTag = tagName;
      const tagNavBtn = document.querySelectorAll('.nav-item')[3];
      switchTab('tags', 'タグ', tagNavBtn);
    }

    function toggleLike(id) {
      const tx = db.transaction(['tweets'], 'readwrite');
      const store = tx.objectStore('tweets');
      const req = store.get(id);
      req.onsuccess = function() {
        const t = req.result;
        if (!t) return;
        t.isLiked = !t.isLiked;
        t.likeCount = t.isLiked ? (t.likeCount || 0) + 1 : Math.max(0, (t.likeCount || 1) - 1);
        store.put(t);
        tx.oncomplete = () => refreshCurrentView();
      };
    }

    function toggleRetweet(id) {
      const tx = db.transaction(['tweets'], 'readwrite');
      const store = tx.objectStore('tweets');
      const req = store.get(id);
      req.onsuccess = function() {
        const t = req.result;
        if (!t) return;
        t.isRetweeted = !t.isRetweeted;
        t.retweetCount = t.isRetweeted ? (t.retweetCount || 0) + 1 : Math.max(0, (t.retweetCount || 1) - 1);
        t.retweetedAt = t.isRetweeted ? Date.now() : null;
        store.put(t);
        tx.oncomplete = () => refreshCurrentView();
      };
    }

    function toggleBookmark(id) {
      const tx = db.transaction(['tweets'], 'readwrite');
      const store = tx.objectStore('tweets');
      const req = store.get(id);
      req.onsuccess = function() {
        const t = req.result;
        if (!t) return;
        t.isBookmarked = !t.isBookmarked;
        store.put(t);
        tx.oncomplete = () => refreshCurrentView();
      };
    }

    function refreshCurrentView() {
      if (document.getElementById('view-calendar').classList.contains('active')) {
        renderCalendarTimeline();
      } else if (document.getElementById('view-tags').classList.contains('active')) {
        renderTagsView();
      } else if (document.getElementById('view-media').classList.contains('active')) {
        renderMediaView();
      } else {
        loadTweets();
      }
    }

    function shareTweet(text) {

      }
    }

    /* カレンダー画面のロジック */
    let allCalendarTweets = [];

    function renderCalendarView() {
      if (!db) return;

      const tx = db.transaction(['tweets'], 'readonly');
      const store = tx.objectStore('tweets');
      const getAllReq = store.getAll();

      getAllReq.onsuccess = function() {
        allCalendarTweets = getAllReq.result;
        drawCalendar();
      };
    }

    function changeCalMonth(delta) {
      calCurrentMonth += delta;
      if (calCurrentMonth < 0) {
        calCurrentMonth = 11;
        calCurrentYear--;
      } else if (calCurrentMonth > 11) {
        calCurrentMonth = 0;
        calCurrentYear++;
      }
      drawCalendar();
    }

    function drawCalendar() {
      const year = calCurrentYear;
      const month = calCurrentMonth;

      document.getElementById('calDisplayMonth').textContent = `${year}年 ${month + 1}月`;
      document.getElementById('calMonthLabel').textContent = `${year}年${month + 1}月のつぶやき`;

      const tweetCountByDate = {};
      let monthTotal = 0;

      allCalendarTweets.forEach(t => {
        const d = new Date(t.createdAt);
        if (d.getFullYear() === year && d.getMonth() === month) {
          monthTotal++;
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          const key = `${yyyy}-${mm}-${dd}`;
          tweetCountByDate[key] = (tweetCountByDate[key] || 0) + 1;
        }
      });

      document.getElementById('calTotalCount').textContent = monthTotal;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      weekdays.forEach(w => {
        const el = document.createElement('div');
        el.className = 'cal-weekday';
        el.textContent = w;
        grid.appendChild(el);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-day-cell empty';
        grid.appendChild(empty);
      }

      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      if (!calSelectedDateStr) {
        calSelectedDateStr = todayStr;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dayStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const count = tweetCountByDate[dayStr] || 0;

        const cell = document.createElement('div');
        let classes = 'cal-day-cell';
        if (count > 0) classes += ' has-tweets';
        if (dayStr === calSelectedDateStr) classes += ' selected';
        cell.className = classes;

        cell.innerHTML = `
          <span class="cal-day-number">${day}</span>
          ${count > 0 ? '<div class="cal-day-badge"></div>' : ''}
        `;

        cell.onclick = () => {
          calSelectedDateStr = dayStr;
          drawCalendar();
        };

        grid.appendChild(cell);
      }

      renderCalendarTimeline();
    }

    function renderCalendarTimeline() {
      const container = document.getElementById('calendarTimeline');
      container.innerHTML = '';

      if (!calSelectedDateStr) return;

      const parts = calSelectedDateStr.split('-');
      document.getElementById('selectedDateTitle').textContent = `${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日のつぶやき`;

      const dayTweets = allCalendarTweets.filter(t => {
        const d = new Date(t.createdAt);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}` === calSelectedDateStr;
      });

      if (dayTweets.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
            <div>この日のつぶやきはありませんわ</div>
          </div>`;
      } else {
        dayTweets.sort((a, b) => b.createdAt - a.createdAt);
        dayTweets.forEach(t => {
          container.appendChild(createTweetCard(t, false));
        });
      }
    }

    /* 検索処理 */

    /* タグ画面の描写処理 */
    function renderTagsView() {
      if (!db) return;

      const tx = db.transaction(['tweets'], 'readonly');
      const store = tx.objectStore('tweets');
      const getAllReq = store.getAll();

      getAllReq.onsuccess = function() {
        const tweets = getAllReq.result;
        tweets.sort((a, b) => b.createdAt - a.createdAt);

        currentTagCounts = {};
        const foundTagsInPosts = [];
        tweets.forEach(t => {
          const matches = t.text.match(/#([^\s\u3000]+)/g);
          if (matches) {
            matches.forEach(rawTag => {
              const tag = rawTag.substring(1);
              if (!currentTagCounts[tag]) {
                currentTagCounts[tag] = 0;
                foundTagsInPosts.push(tag);
              }
              currentTagCounts[tag]++;
            });
          }
        });

        const tagListBar = document.getElementById('tagListBar');
        tagListBar.innerHTML = '';

        const allFoundTags = Object.keys(currentTagCounts);

        if (allFoundTags.length === 0) {
          document.querySelector('.tag-header-area').style.display = 'none';
          document.getElementById('tagTimeline').innerHTML = `
            <div class="empty-state">
              <svg viewBox="0 0 24 24"><path d="M20 10V8h-4V4h-2v4h-4V4H8v4H4v2h4v4H4v2h4v4h2v-4h4v4h2v-4h4v-2h-4v-4h4zm-6 4h-4v-4h4v4z"/></svg>
              <div>まだ #タグ 付きの投稿がありませんわ</div>
            </div>`;
          return;
        }

        document.querySelector('.tag-header-area').style.display = 'flex';

        foundTagsInPosts.forEach(tag => {
          if (!customTagOrder.includes(tag)) {
            customTagOrder.push(tag);
          }
        });

        customTagOrder = customTagOrder.filter(tag => currentTagCounts[tag] > 0);
        saveTagOrderToIDB();

        if (!activeSelectedTag || !currentTagCounts[activeSelectedTag]) {
          activeSelectedTag = customTagOrder[0];
        }

        customTagOrder.forEach((tag) => {
          const pill = document.createElement('div');
          pill.className = `tag-pill ${tag === activeSelectedTag ? 'active' : ''}`;
          pill.onclick = () => {
            activeSelectedTag = tag;
            renderTagsView();
          };

          pill.innerHTML = `
            <span class="tag-pill-name">#${escapeHtml(tag)}</span>
            <span class="tag-pill-count">${currentTagCounts[tag]}</span>
          `;
          tagListBar.appendChild(pill);
        });

        const tagTimeline = document.getElementById('tagTimeline');
        tagTimeline.innerHTML = '';

        const filtered = tweets.filter(t => t.text.includes(`#${activeSelectedTag}`));
        filtered.forEach(t => {
          tagTimeline.appendChild(createTweetCard(t, false));
        });
      };
    }

    /* メディア画面の描写処理 */
    function renderMediaView() {
  if (!db) return;

  const tx = db.transaction(['tweets'], 'readonly');
  const store = tx.objectStore('tweets');
  const getAllReq = store.getAll();

  getAllReq.onsuccess = function() {
    const tweets = getAllReq.result;
    tweets.sort((a, b) => b.createdAt - a.createdAt);

    const grid = document.getElementById('mediaGrid');
    grid.innerHTML = '';

    let allImages = [];
    tweets.forEach(t => {
      const imgs = t.images || (t.image ? [t.image] : []);
      imgs.forEach(img => allImages.push(img));
    });

    if (allImages.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column: span 3;">
          <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          <div>まだ画像付きの投稿がありませんわ</div>
        </div>`;
      return;
    }

    allImages.forEach(imgSrc => {
      const item = document.createElement('div');
      item.className = 'media-grid-item';
      item.innerHTML = `<img src="${imgSrc}" alt="media">`;
      item.onclick = () => openImageModal(null, imgSrc);
      grid.appendChild(item);
    });
  };
}

    /* タグ管理モーダル処理 */
    function openTagManageModal() {
      const modal = document.getElementById('tagManageModal');
      const listContainer = document.getElementById('tagModalList');
      listContainer.innerHTML = '';

      customTagOrder.forEach((tag, index) => {
        const item = document.createElement('div');
        item.className = 'tag-modal-item';
        item.draggable = true;
        item.dataset.index = index;

        item.innerHTML = `
          <div class="tag-modal-item-left">
            <span class="tag-modal-handle">
              <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
            </span>
            <span class="tag-modal-name">#${escapeHtml(tag)}</span>
          </div>
          <span class="tag-modal-count">${currentTagCounts[tag]}件</span>
        `;

        bindVerticalDragEvents(item);
        listContainer.appendChild(item);
      });

      modal.classList.add('show');
    }

    function closeTagManageModal() {
      document.getElementById('tagManageModal').classList.remove('show');
      renderTagsView();
    }

    let verticalDraggedIndex = null;

    function bindVerticalDragEvents(item) {
      item.addEventListener('dragstart', (e) => {
        verticalDraggedIndex = parseInt(item.dataset.index);
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });

      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });

      item.addEventListener('drop', (e) => {
        e.preventDefault();
        const targetIndex = parseInt(item.dataset.index);
        if (verticalDraggedIndex !== null && verticalDraggedIndex !== targetIndex) {
          reorderTagsModal(verticalDraggedIndex, targetIndex);
        }
      });

      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        verticalDraggedIndex = null;
      });

      let touchItem = null;

      item.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchItem = item;
          verticalDraggedIndex = parseInt(item.dataset.index);
        }
      }, { passive: true });

      item.addEventListener('touchmove', (e) => {
        if (!touchItem) return;
        const currentY = e.touches[0].clientY;
        const targetEl = document.elementFromPoint(e.touches[0].clientX, currentY);
        if (targetEl) {
          const targetItem = targetEl.closest('.tag-modal-item');
          if (targetItem && targetItem !== touchItem) {
            const targetIndex = parseInt(targetItem.dataset.index);
            if (verticalDraggedIndex !== null && targetIndex !== undefined && verticalDraggedIndex !== targetIndex) {
              reorderTagsModal(verticalDraggedIndex, targetIndex);
              verticalDraggedIndex = targetIndex;
            }
          }
        }
      }, { passive: true });

      item.addEventListener('touchend', () => {
        touchItem = null;
        verticalDraggedIndex = null;
      });
    }

    function reorderTagsModal(fromIndex, toIndex) {
      const movedTag = customTagOrder.splice(fromIndex, 1)[0];
      customTagOrder.splice(toIndex, 0, movedTag);
      saveTagOrderToIDB();
      openTagManageModal();
    }

    function toggleMenu(event, id) {
      event.stopPropagation();
      const targetMenu = document.getElementById(`menu-${id}`);
      const isShow = targetMenu.classList.contains('show');
      document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
      if (!isShow) {
        targetMenu.classList.add('show');
      }
    }

    document.addEventListener('click', function() {
      document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
    });

    function deleteTweet(id) {
      if (!confirm('この投稿を削除しますか？')) return;

      const tx = db.transaction(['tweets'], 'readwrite');
      const store = tx.objectStore('tweets');
      store.delete(id);

      tx.oncomplete = function() {
        refreshCurrentView();
      };
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    /* アバター画像選択・トリミング機能 */
    let loadedImage = null;
    let cropScale = 1;
    let cropPosX = 0;
    let cropPosY = 0;
    let isDraggingCrop = false;
    let dragStartX = 0;
    let dragStartY = 0;

    function triggerAvatarSelect() {
      document.getElementById('avatarFileInput').click();
    }

    function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        loadedImage = new Image();
        loadedImage.onload = function() {
          setupCropCanvas();
          document.getElementById('cropModal').classList.add('show');
        };
        loadedImage.src = e.target.result;
      };
      reader.readAsDataURL(file);
      event.target.value = '';
    }

    function setupCropCanvas() {
      cropScale = 1;
      document.getElementById('zoomSlider').value = 1;
      
      const canvas = document.getElementById('cropCanvas');
      const initialScale = Math.max(canvas.width / loadedImage.width, canvas.height / loadedImage.height);
      cropPosX = (canvas.width - loadedImage.width * initialScale) / 2;
      cropPosY = (canvas.height - loadedImage.height * initialScale) / 2;

      drawCrop();
      bindCropEvents();
    }

    function drawCrop() {
      const canvas = document.getElementById('cropCanvas');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!loadedImage) return;

      const baseScale = Math.max(canvas.width / loadedImage.width, canvas.height / loadedImage.height);
      const currentScale = baseScale * cropScale;
      const w = loadedImage.width * currentScale;
      const h = loadedImage.height * currentScale;

      ctx.drawImage(loadedImage, cropPosX, cropPosY, w, h);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.beginPath();
      ctx.rect(0, 0, canvas.width, canvas.height);
      ctx.arc(canvas.width / 2, canvas.height / 2, 110, 0, Math.PI * 2, true);
      ctx.fill();

      ctx.strokeStyle = '#1d9bf0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 110, 0, Math.PI * 2);
      ctx.stroke();
    }

    function onZoomChange() {
      cropScale = parseFloat(document.getElementById('zoomSlider').value);
      drawCrop();
    }

    function bindCropEvents() {
      const canvas = document.getElementById('cropCanvas');

      const startDrag = (x, y) => {
        isDraggingCrop = true;
        dragStartX = x - cropPosX;
        dragStartY = y - cropPosY;
      };

      const moveDrag = (x, y) => {
        if (!isDraggingCrop) return;
        cropPosX = x - dragStartX;
        cropPosY = y - dragStartY;
        drawCrop();
      };

      const endDrag = () => { isDraggingCrop = false; };

      canvas.onmousedown = (e) => startDrag(e.clientX, e.clientY);
      window.onmousemove = (e) => moveDrag(e.clientX, e.clientY);
      window.onmouseup = endDrag;

      canvas.ontouchstart = (e) => {
        if (e.touches.length === 1) {
          startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }
      };
      window.ontouchend = endDrag;
    }

    function closeCropModal() {
      document.getElementById('cropModal').classList.remove('show');
    }

    function saveCroppedAvatar() {
      const outputCanvas = document.createElement('canvas');
      outputCanvas.width = 200;
      outputCanvas.height = 200;
      const ctx = outputCanvas.getContext('2d');

      const srcCanvas = document.getElementById('cropCanvas');
      ctx.beginPath();
      ctx.arc(100, 100, 100, 0, Math.PI * 2);
      ctx.clip();

      ctx.drawImage(
        srcCanvas,
        30, 30, 220, 220,
        0, 0, 200, 200
      );

      const croppedDataUrl = outputCanvas.toDataURL('image/png');
      currentUser.avatar = croppedDataUrl;

      saveAvatarToIDB(croppedDataUrl);
      renderAllAvatars();
      closeCropModal();
    }

    /* 画像拡大モーダル制御 */
    function openImageModal(event, src) {
      if (event) event.stopPropagation();
      document.getElementById('imageModalImg').src = src;
      document.getElementById('imageModal').classList.add('show');
    }

    function closeImageModal() {
      document.getElementById('imageModal').classList.remove('show');
    }

    /* ツイート詳細（単体スレッド表示）モーダル制御 */
    function openDetailModal(id) {
      const tx = db.transaction(['tweets'], 'readonly');
      const store = tx.objectStore('tweets');
      const getAllReq = store.getAll();

      getAllReq.onsuccess = function() {
        const tweets = getAllReq.result;
        const target = tweets.find(t => t.id === id);
        if (!target) return;

        const content = document.getElementById('detailModalContent');
        content.innerHTML = '';

        // 親投稿があればそれも上に表示
        if (target.parentId) {
          const parent = tweets.find(t => t.id === target.parentId);
          if (parent) {
            content.appendChild(createTweetCard(parent, true));
          }
        }

        // メイン投稿を表示
        content.appendChild(createTweetCard(target, false));

        // 返信スレッド（子投稿）があれば下に表示
        const replies = tweets.filter(t => t.parentId === target.id).sort((a, b) => a.createdAt - b.createdAt);
        replies.forEach(r => {
          content.appendChild(createTweetCard(r, false));
        });

        document.getElementById('detailModal').classList.add('show');
      };
    }

    function closeDetailModal(event) {
      if (event.target.id === 'detailModal') {
        document.getElementById('detailModal').classList.remove('show');
      }
    }

    function closeDetailModalDirect() {
      document.getElementById('detailModal').classList.remove('show');
    }

    // Service Workerの登録
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
